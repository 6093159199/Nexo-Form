<html lang="th" data-theme="light">

<head>

    <link rel="manifest"
        href="data:application/json;base64,ewogICJuYW1lIjogIkZvcm1GbG93KyIsCiAgInNob3J0X25hbWUiOiAiRm9ybUZsb3ciLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2ZmZmZmZiIsCiAgInRoZW1lX2NvbG9yIjogIiM3YzNhZWQiLAogICJpY29ucyI6IFt7InNyYyI6ICJkYXRhOmltYWdlL3N2Zyt4bWw7YmFzZTY0LFBITjJaeUIzYVdSMGFEMG5OelluSUhacFpYZENiM2h3YkQwbmRUUjBKejQ4TDNOMlp6ND0iLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3N2Zyt4bWwiIH1dCn0=">
    <title>FormFlow+ ✨</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'thai': ['Kanit', 'Inter', 'sans-serif'],
                        'sans': ['Inter', 'Kanit', 'sans-serif'],
                    },
                    colors: {
                        'accent': {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7c3aed',
                            800: '#6d28d9',
                            900: '#5b21b6',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'bounce-soft': 'bounceSoft 2s infinite',
                        'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(124,58,237,0.3)' },
                            '100%': { boxShadow: '0 0 40px rgba(124,58,237,0.6)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        bounceSoft: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        },
                    },
                },
            },
        };
    </script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            --glass-blur: blur(20px);
            --neo-shadow-light: 8px 8px 16px #d1d5db, -8px -8px 16px #ffffff;
            --neo-shadow-dark: 8px 8px 16px #1f1f2e, -8px -8px 16px #2d2d44;
            --accent-hue: 265;
            --accent-sat: 84%;
            --accent-light: 65%;
            --bg-gradient-light: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 25%, #faf5ff 50%, #e0e7ff 75%, #f0f9ff 100%);
            --bg-gradient-dark: linear-gradient(135deg, #0f0a1a 0%, #1a1030 25%, #0d0d1f 50%, #1a0a2e 75%, #0a0a1a 100%);
            --card-3d-transform: perspective(1000px) rotateX(2deg) rotateY(-2deg);
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --glass-bg: rgba(30, 25, 45, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
            --glass-blur: blur(24px);
            --accent-light: 55%;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kanit', 'Inter', sans-serif;
            background: var(--bg-gradient-light);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            transition: var(--transition-smooth);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .dark body,
        body.dark {
            background: var(--bg-gradient-dark);
            color: #e2e8f0;
        }

        [data-theme="dark"] body {
            background: var(--bg-gradient-dark);
            color: #e2e8f0;
        }

        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            box-shadow: var(--glass-shadow);
            transition: var(--transition-smooth);
        }

        .glass:hover {
            box-shadow: 0 12px 50px rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.4);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: var(--glass-shadow);
            transition: var(--transition-smooth);
            transform: var(--card-3d-transform);
        }

        .glass-card:hover {
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(-4px);
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.2);
        }

        /* 3D Neo-Shadow */
        .neo-3d {
            border-radius: 1.25rem;
            background: linear-gradient(145deg, #f8f7ff, #e8e5f0);
            box-shadow: var(--neo-shadow-light);
            transition: var(--transition-smooth);
        }

        [data-theme="dark"] .neo-3d {
            background: linear-gradient(145deg, #232035, #1a1728);
            box-shadow: var(--neo-shadow-dark);
        }

        .neo-3d:active {
            box-shadow: inset 4px 4px 8px #d1d5db, inset -4px -4px 8px #ffffff;
        }

        [data-theme="dark"] .neo-3d:active {
            box-shadow: inset 4px 4px 8px #1f1f2e, inset -4px -4px 8px #2d2d44;
        }

        .neo-btn {
            border-radius: 1rem;
            background: linear-gradient(145deg, #f0ecff, #ddd6f5);
            box-shadow: 4px 4px 10px #d1cce0, -4px -4px 10px #ffffff;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-weight: 600;
        }

        [data-theme="dark"] .neo-btn {
            background: linear-gradient(145deg, #2d2640, #1e1830);
            box-shadow: 4px 4px 10px #151025, -4px -4px 10px #2d2440;
            color: #e2e8f0;
        }

        .neo-btn:active {
            box-shadow: inset 4px 4px 8px #c4bfd6, inset -4px -4px 8px #ffffff;
            transform: scale(0.97);
        }

        [data-theme="dark"] .neo-btn:active {
            box-shadow: inset 4px 4px 8px #110d1c, inset -4px -4px 8px #2d2440;
        }

        /* Floating particles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
            opacity: 0.5;
            font-size: 2rem;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            33% {
                transform: translateY(-30px) rotate(10deg);
            }

            66% {
                transform: translateY(-15px) rotate(-5deg);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.35);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.6);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 0.4rem;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.12);
            max-width: 95vw;
        }

        [data-theme="dark"] .bottom-nav {
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.4);
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 0.9rem;
            border-radius: 1.2rem;
            text-decoration: none;
            color: #6b7280;
            font-size: 0.7rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            white-space: nowrap;
            min-width: 52px;
            position: relative;
        }

        .bottom-nav a i {
            font-size: 1.3rem;
            margin-bottom: 2px;
            transition: var(--transition-smooth);
        }

        .bottom-nav a.active {
            color: #7c3aed;
            background: rgba(124, 58, 237, 0.12);
            font-weight: 700;
        }

        .bottom-nav a.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 20px;
            height: 3px;
            border-radius: 10px;
            background: #7c3aed;
        }

        /* Sidebar overlay */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Pulse ring */
        .pulse-ring {
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(124, 58, 237, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0);
            }
        }

        /* Shimmer */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .glass-card {
                border-radius: 1rem;
            }

            .bottom-nav {
                bottom: 0.5rem;
                padding: 0.4rem 0.7rem;
                gap: 0.2rem;
                border-radius: 1.5rem;
            }

            .bottom-nav a {
                padding: 0.4rem 0.6rem;
                font-size: 0.65rem;
                min-width: 40px;
            }

            .bottom-nav a i {
                font-size: 1.1rem;
            }

            .sidebar-desktop {
                display: none;
            }
        }

        @media (min-width: 769px) {
            .bottom-nav {
                display: none;
            }

            .sidebar-desktop {
                display: flex;
            }
        }

        /* Input styles */
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="url"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        textarea,
        select {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem;
            padding: 0.65rem 1rem;
            font-family: inherit;
            transition: var(--transition-smooth);
            width: 100%;
            font-size: 0.95rem;
        }

        [data-theme="dark"] input[type="text"],
        [data-theme="dark"] input[type="password"],
        [data-theme="dark"] input[type="email"],
        [data-theme="dark"] input[type="url"],
        [data-theme="dark"] input[type="date"],
        [data-theme="dark"] input[type="time"],
        [data-theme="dark"] input[type="number"],
        [data-theme="dark"] textarea,
        [data-theme="dark"] select {
            background: rgba(40, 35, 60, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast-item {
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: inherit;
            font-weight: 500;
            animation: slideIn 0.4s ease-out;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            max-width: 380px;
            font-size: 0.9rem;
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Modal */
        .modal-glass {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="font-thai">

    <!-- Floating particles -->
    <div id="particles"></div>

    <!-- Root -->
    <div id="root"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script type="text/babel">
        // ─────────────────────────────────────
        // 🎨 THEME TOKENS — แก้ไขได้ที่ไฟล์เดียว
        // ─────────────────────────────────────
        const ThemeTokens = {
            accentColor: '#7c3aed',
            accentHue: 265,
            accentSat: '84%',
            borderRadius: '1.25rem',
            glassOpacity: 0.55,
            darkGlassOpacity: 0.65,
            blurAmount: '20px',
            fontFamily: "'Kanit','Inter',sans-serif",
            defaultDarkMode: false,
            adminPassword: 'admin123', // 🔒 เปลี่ยนรหัสผ่านที่นี่
            googleAppsScriptURL: 'https://script.google.com/macros/s/AKfycbz4b3kaBokaiu1VIXd1sJgtQCkh5WeE84xj-skG8AXe5tH_HhoEpp4uWbo-uqxzyjfVvw/exec', // 🔗 ใส่ Google Apps Script Web App URL ที่นี่
            sheetsSyncEnabled: false,
        };

        // ─────────────────────────────────────
        // 📦 LocalStorage Helpers
        // ─────────────────────────────────────
        const LS = {
            get(key, fallback = null) {
                try {
                    const v = localStorage.getItem('formflow_' + key); return v ? JSON.parse(v) :
                        fallback;
                } catch (e) { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem('formflow_' + key, JSON.stringify(value)); } catch (e) { }
            },
            remove(key) {
                try { localStorage.removeItem('formflow_' + key); } catch (e) { }
            },
        };

        // ─────────────────────────────────────
        // 🔔 Toast System
        // ─────────────────────────────────────
        let toastId = 0;
        const toastListeners = [];

        function showToast(message, type = 'info', duration = 3000) {
            const id = ++toastId;
            toastListeners.forEach(fn => fn({ id, message, type, duration }));
            return id;
        }
        function subscribeToasts(fn) {
            toastListeners.push(fn);
            return () => {
                const i = toastListeners.indexOf(fn); if (i > -1) toastListeners.splice(i,
                    1);
            };
        }

        function ToastContainer() {
            const [toasts, setToasts] = React.useState([]);
            React.useEffect(() => {
                const unsub = subscribeToasts((t) => {
                    setToasts(prev => [...prev, t]);
                    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t.id)), t.duration);
                });
                return unsub;
            }, []);
            const icons = { info: '🔔', success: '✅', error: '❌', warning: '⚠️' };
            return React.createElement('div', { className: 'toast-container' },
                toasts.map(t => React.createElement('div', { key: t.id, className: 'toast-item animate-slide-up' },
                    icons[t.type] || '🔔', ' ', t.message
                ))
            );
        }

        // ─────────────────────────────────────
        // 🌐 Google Sheets API Service
        // ─────────────────────────────────────
        const SheetsAPI = {
            async syncFormData(formData) {
                if (!ThemeTokens.googleAppsScriptURL || !ThemeTokens.sheetsSyncEnabled) {
                    // ใช้ localStorage แทน
                    const existing = LS.get('forms', []);
                    const idx = existing.findIndex(f => f.id === formData.id);
                    if (idx > -1) existing[idx] = formData;
                    else existing.push(formData);
                    LS.set('forms', existing);
                    return { success: true, localOnly: true };
                }
                try {
                    const resp = await fetch(ThemeTokens.googleAppsScriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveForm', data: formData }),
                    });
                    const existing = LS.get('forms', []);
                    const idx = existing.findIndex(f => f.id === formData.id);
                    if (idx > -1) existing[idx] = formData;
                    else existing.push(formData);
                    LS.set('forms', existing);
                    return { success: true };
                } catch (e) {
                    console.warn('Google Sheets sync failed, using localStorage:', e);
                    const existing = LS.get('forms', []);
                    const idx = existing.findIndex(f => f.id === formData.id);
                    if (idx > -1) existing[idx] = formData;
                    else existing.push(formData);
                    LS.set('forms', existing);
                    return { success: true, localOnly: true };
                }
            },
            async deleteFormData(formId) {
                const existing = LS.get('forms', []);
                LS.set('forms', existing.filter(f => f.id !== formId));
                if (ThemeTokens.googleAppsScriptURL && ThemeTokens.sheetsSyncEnabled) {
                    try {
                        await fetch(ThemeTokens.googleAppsScriptURL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'deleteForm', formId }),
                        });
                    } catch (e) { }
                }
                return { success: true };
            },
            async submitResponse(formId, responseData) {
                const responses = LS.get('responses_' + formId, []);
                responseData.id = 'resp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                responseData.submittedAt = new Date().toISOString();
                responses.push(responseData);
                LS.set('responses_' + formId, responses);
                if (ThemeTokens.googleAppsScriptURL && ThemeTokens.sheetsSyncEnabled) {
                    try {
                        await fetch(ThemeTokens.googleAppsScriptURL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'submitResponse', formId, data: responseData }),
                        });
                    } catch (e) { }
                }
                return { success: true };
            },
            getResponses(formId) {
                return LS.get('responses_' + formId, []);
            },
        };

        // ─────────────────────────────────────
        // 🔐 Auth Context
        // ─────────────────────────────────────
        const AuthContext = React.createContext();
        function AuthProvider({ children }) {
            const [isAdmin, setIsAdmin] = React.useState(LS.get('admin_session', false));
            const login = (password) => {
                if (password === ThemeTokens.adminPassword) {
                    setIsAdmin(true);
                    LS.set('admin_session', true);
                    return true;
                }
                return false;
            };
            const logout = () => {
                setIsAdmin(false);
                LS.set('admin_session', false);
            };
            return React.createElement(AuthContext.Provider, { value: { isAdmin, login, logout } }, children);
        }
        function useAuth() { return React.useContext(AuthContext); }

        // ─────────────────────────────────────
        // 🌓 Theme Context
        // ─────────────────────────────────────
        const ThemeContext = React.createContext();
        function ThemeProvider({ children }) {
            const [darkMode, setDarkMode] = React.useState(LS.get('darkMode', ThemeTokens.defaultDarkMode));
            const [accentColor, setAccentColor] = React.useState(LS.get('accentColor', ThemeTokens.accentColor));
            React.useEffect(() => {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');

                                                showToast('คัดลอก URL! 📋', 'success');
                                            },
                                            variant: 'ghost',
                                            icon: 'fa-solid fa-link',
                                            style: { padding: '0.4rem 0.8rem', fontSize: '0.85rem' }
                                        }, 'URL'),
                                        React.createElement(NeoButton, {
                                            onClick: () => onNavigate('dashboard'),
                                            variant: 'ghost',
                                            icon: 'fa-solid fa-chart-bar',
                                            style: { padding: '0.4rem 0.8rem', fontSize: '0.85rem' }
                                        }, 'รายงาน'),
                                        React.createElement(NeoButton, {
                                            onClick: () => handleDelete(form.id),
                                            variant: 'danger',
                                            icon: 'fa-solid fa-trash',
                                            style: { padding: '0.4rem 0.8rem', fontSize: '0.85rem' }
                                        }, 'ลบ'),
                                    )
                                )
                            )
                        )
                    )
            );
        }

        // ─────────────────────────────────────
        // 🚀 Main App
        // ─────────────────────────────────────
        function App() {
            const { isAdmin } = useAuth();
            const { darkMode, toggleDark } = useTheme();
            const [currentView, setCurrentView] = React.useState('home');
            const [showLogin, setShowLogin] = React.useState(false);

            const navigate = (view) => {
                if (view === 'admin' && !isAdmin) {
                    setShowLogin(true);
                    return;
                }
                setCurrentView(view);
                setShowLogin(false);
                window.location.hash = view;
            };

            // Listen to hash changes
            React.useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '') || 'home';
                    if (hash.startsWith('fill-')) {
                        setCurrentView(hash);
                    } else if (hash.startsWith('edit-') && isAdmin) {
                        setCurrentView(hash);
                    } else if (['home', 'forms', 'admin', 'dashboard', 'settings', 'builder'].includes(hash)) {
                        if (hash === 'admin' && !isAdmin) setShowLogin(true);
                        else {
                            setCurrentView(hash);
                            setShowLogin(false);
                        }
                    }
                };
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, [isAdmin]);

            const renderView = () => {
                if (showLogin && !isAdmin) {
                    return React.createElement(AdminLogin, {
                        onLogin: () => {
                            setShowLogin(false);
                            setCurrentView('admin');
                            window.location.hash = 'admin';
                        }
                    });
                }
                if (currentView === 'home') return React.createElement(HomeView, {
                    onNavigate: navigate,
                    isAdmin
                });
                if (currentView === 'forms') return React.createElement(HomeView, {
                    onNavigate: navigate,
                    isAdmin
                });
                if (currentView === 'admin' && isAdmin) return React.createElement(AdminPanelView, {
                    onNavigate: (
                        v) => navigate(v)
                });
                if (currentView === 'dashboard' && isAdmin) return React.createElement(DashboardView);
                if (currentView === 'settings') return React.createElement(SettingsView);
                if (currentView === 'builder' && isAdmin) return React.createElement(FormBuilder, {
                    formId: null,
                    onBack: () => navigate('admin')
                });
                if (currentView.startsWith('edit-') && isAdmin) {
                    const fid = currentView.replace('edit-', '');
                    return React.createElement(FormBuilder, { formId: fid, onBack: () => navigate('admin') });
                }
                if (currentView.startsWith('fill-')) {
                    return React.createElement(FormFillView, { formId: currentView });
                }
                return React.createElement(HomeView, { onNavigate: navigate, isAdmin });
            };

            return React.createElement('div', { style: { paddingBottom: '100px', paddingLeft: '0', minHeight: '100vh' } },
                React.createElement(Sidebar, { currentView, onNavigate: navigate, isAdmin, darkMode, toggleDark }),
                React.createElement('div', {
                    className: 'ms-md-auto', style: {
                        maxWidth: 'calc(100% - 300px)',
                        margin: '0 auto', paddingTop: '0.5rem'
                    }
                },
                    renderView()
                ),
                React.createElement(BottomNav, { currentView, onNavigate: navigate, isAdmin }),
                React.createElement(ToastContainer)
            );
        }

        // ─────────────────────────────────────
        // 🌟 Particles Background
        // ─────────────────────────────────────
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            const emojis = ['✨', '🪄', '💫', '⭐', '🌸', '🔮', '💜', '🦋'];
            for (let i = 0; i < 15; i++) {
                const span = document.createElement('span');
                span.className = 'particle';
                span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = Math.random() * 90 + '%';
                span.style.top = Math.random() * 80 + '%';
                span.style.animationDelay = Math.random() * 6 + 's';
                span.style.animationDuration = (4 + Math.random() * 8) + 's';
                span.style.opacity = (0.2 + Math.random() * 0.4);
                span.style.fontSize = (1 + Math.random() * 2.5) + 'rem';
                container.appendChild(span);
            }
        }

        // ─────────────────────────────────────
        // 📦 PWA Service Worker Registration
        // ─────────────────────────────────────
        function registerSW() {
            if ('serviceWorker' in navigator) {
                const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', e => {
              e.respondWith(
                caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
                  const clone = resp.clone();
                  caches.open('formflow-v1').then(c => c.put(e.request, clone));
                  return resp;
                }).catch(() => caches.match(e.request)))
              );
            });`;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                navigator.serviceWorker.register(url).catch(() => { });
            }
        }

        // ─────────────────────────────────────
        // 🚀 Bootstrap App
        // ─────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            registerSW();
            const root = document.getElementById('root');
            ReactDOM.createRoot(root).render(
                React.createElement(ThemeProvider, null,
                    React.createElement(AuthProvider, null,
                        React.createElement(FormsProvider, null,
                            React.createElement(App)
                        )
                    )
                )
            );
        });

        // Export for global access (debugging)
        window.FormFlow = {
            ThemeTokens,
            LS,
            SheetsAPI,
            showToast,
        };
        console.log('✨ FormFlow+ Ready! 🚀');
        console.log('🔑 Admin password:', ThemeTokens.adminPassword);
        console.log('📋 Google Sheets URL:', ThemeTokens.googleAppsScriptURL || 'Not configured (using localStorage)');
        console.log('🌐 Open #admin to manage forms, #fill-<formId> to fill a form');
    </script>
</body>
