                        </div>
                    </div>
                </div>
            );
        }

        function FormsPage({ forms, responses, onAdd, onEdit, onDelete, onToggle, onViewUrl }) {
            const [search, setSearch] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editForm, setEditForm] = useState(null);
            const addRipple = useRipple();
            const filtered = forms.filter(f => f.title.toLowerCase().includes(search.toLowerCase()));

            const handleSave = async (data) => {
                try {
                    if (editForm?.id) {
                        await onEdit(editForm.id, data);
                        showSuccessAlert('อัปเดตฟอร์มแล้ว!', `ฟอร์ม "${data.title}" ถูกอัปเดตเรียบร้อยแล้ว 🌸`);
                    } else {
                        await onAdd(data);
                        showSuccessAlert('สร้างฟอร์มสำเร็จ!', `ฟอร์ม "${data.title}" ถูกสร้างเรียบร้อยแล้ว ✨`);
                    }
                    setShowModal(false);
                    setEditForm(null);
                } catch (err) {
                    showErrorAlert('เกิดข้อผิดพลาด', err.message);
                }
            };

            const handleDelete = (form) => {
                showDeleteConfirm('ลบฟอร์ม?', `คุณแน่ใจหรือไม่ที่จะลบ "${form.title}"?<br><small style="color: var(--txt3)">การกระทำนี้จะลบคำตอบทั้งหมดด้วยและไม่สามารถกู้คืนได้</small>`)
                    .then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await onDelete(form.id);
                                showSuccessAlert('ลบฟอร์มแล้ว', `ฟอร์ม "${form.title}" ถูกลบเรียบร้อยแล้ว`);
                            } catch (err) {
                                showErrorAlert('เกิดข้อผิดพลาด', err.message);
                            }
                        }
                    });
            };

            const handleToggle = (form, newStatus) => {
                const action = newStatus ? 'เปิด' : 'ปิด';
                const emoji = newStatus ? '📬' : '🔒';
                const colors = getThemeColors();

                Swal.fire({
                    title: `${emoji} ${action}รับคำตอบ?`,
                    html: `คุณต้องการ${action}รับคำตอบสำหรับฟอร์ม "${form.title}" ใช่หรือไม่?`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: newStatus ? '#2BAF88' : colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: `ใช่ ${action}เลย!`,
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        await onToggle(form.id, newStatus);
                        showSuccessAlert(`${action}รับคำตอบแล้ว`, `ฟอร์ม "${form.title}" ${action}รับคำตอบเรียบร้อยแล้ว`);
                    }
                });
            };

            return (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 20, flexWrap: 'wrap' }}>
                        <div style={{ flex: 1, position: 'relative', minWidth: 200 }}>
                            <Icon name="magnifying-glass" style={{ position: 'absolute', left: 18, top: '50%', transform: 'translateY(-50%)', color: 'var(--txt3)' }} />
                            <input className="form-input" style={{ paddingLeft: 46 }} placeholder="🔍 ค้นหาฟอร์ม..." value={search} onChange={e => setSearch(e.target.value)} />
                        </div>
                        <button className="btn btn-primary ripple" onClick={e => { addRipple(e); setEditForm(null); setShowModal(true); }}>
                            <Icon name="plus" /> สร้างฟอร์มใหม่
                        </button>
                    </div>
                    {filtered.length === 0 ? (
                        <div style={{ textAlign: 'center', padding: 60, color: 'var(--txt3)' }}>
                            <Icon name="file-heart" size="3rem" style={{ marginBottom: 16 }} />
                            <div style={{ fontWeight: 700, fontSize: '1rem' }}>{search ? 'ไม่พบฟอร์มที่ค้นหา' : 'ยังไม่มีฟอร์ม'}</div>
                            <div style={{ marginTop: 8 }}>{search ? 'ลองค้นหาด้วยคำอื่น' : 'คลิก "สร้างฟอร์มใหม่" เพื่อเริ่มต้น~'}</div>
                        </div>
                    ) : (
                        <div className="stagger">
                            {filtered.map(f => (
                                <div key={f.id} className="form-card card">
                                    <div className="form-card-accent-bar" style={{ background: `linear-gradient(90deg,${f.accentColor || 'var(--p1)'},${f.accentColor || 'var(--p3)'})` }} />
                                    <div className="form-card-inner">
                                        <div className="form-card-icon">
                                            {f.headerImage?.startsWith('http') ? <img src={f.headerImage} style={{ width: 36, height: 36, objectFit: 'cover', borderRadius: 12 }} alt="" /> : (f.headerImage || <Icon name="file-heart" size="1.5rem" />)}
                                        </div>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 4 }}>
                                                <span style={{ fontWeight: 700, fontSize: '0.96rem' }}>{f.title}</span>
                                                <span className={`badge ${f.active ? 'badge-on' : 'badge-off'}`}>{f.active ? 'เปิดรับคำตอบ' : 'ปิดรับคำตอบ'}</span>
                                            </div>
                                            {f.description && <p style={{ color: 'var(--txt2)', fontSize: '0.82rem', marginBottom: 8 }}>{f.description}</p>}
                                            <div style={{ display: 'flex', gap: 14, fontSize: '0.78rem', color: 'var(--txt3)', flexWrap: 'wrap' }}>
                                                <span><Icon name="list-check" style={{ marginRight: 4 }} />{(f.questions || []).length} คำถาม</span>
                                                <span><Icon name="inbox" style={{ marginRight: 4 }} />{(responses[f.id] || []).length} คำตอบ</span>
                                                <span><Icon name="calendar" style={{ marginRight: 4 }} />{new Date(f.createdAt).toLocaleDateString('th-TH')}</span>
                                            </div>
                                        </div>
                                        <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                                            <button className="btn-icon" title="ลิงก์ฟอร์ม" onClick={() => onViewUrl(f)}><Icon name="link" /></button>
                                            <label className="toggle" title="เปิด/ปิด">
                                                <input type="checkbox" checked={f.active} onChange={() => handleToggle(f, !f.active)} />
                                                <span className="toggle-slider" />
                                            </label>
                                            <button className="btn-icon" title="แก้ไข" onClick={() => { setEditForm(f); setShowModal(true); }}><Icon name="pen-to-square" /></button>
                                            <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} title="ลบ"
                                                onClick={() => handleDelete(f)}>
                                                <Icon name="trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && <FormModal form={editForm} onSave={handleSave} onClose={() => { setShowModal(false); setEditForm(null); }} />}
                </div>
            );
        }

        function UrlModal({ form, onClose }) {
            const url = getFormUrl(form.id);
            const [copied, setCopied] = useState(false);
            const copy = () => {
                navigator.clipboard?.writeText(url);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card" style={{ maxWidth: 480 }}>
                        <div className="modal-title"><Icon name="link" /> 🔗 ลิงก์ฟอร์มสาธารณะ</div>
                        <p style={{ color: 'var(--txt2)', marginBottom: 14, fontSize: '0.88rem' }}>แชร์ลิงก์นี้ให้ผู้ตอบแบบสอบถาม</p>
                        <div className="url-box">
                            <span style={{ flex: 1, overflowX: 'auto', whiteSpace: 'nowrap' }}>{url}</span>
                            <button className="btn-icon" onClick={copy} style={{ background: copied ? 'rgba(43,175,136,0.1)' : undefined, color: copied ? '#2BAF88' : undefined }}>
                                <Icon name={copied ? 'check' : 'copy'} />
                            </button>
                        </div>
                        <div style={{ marginTop: 18, display: 'flex', gap: 10 }}>
                            <a href={url} target="_blank" rel="noopener" className="btn btn-primary" style={{ textDecoration: 'none' }}>
                                <Icon name="arrow-up-right-from-square" /> เปิดฟอร์ม
                            </a>
                            <button className="btn btn-ghost" onClick={onClose}>ปิด</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ResponsesPage({ forms, responses, onDeleteResponse }) {
            const [selForm, setSelForm] = useState(forms[0]?.id || '');
            const [viewResp, setViewResp] = useState(null);
            const form = forms.find(f => f.id === selForm);
            const resps = responses[selForm] || [];

            const handleDelete = (response) => {
                const index = resps.indexOf(response);
                showDeleteConfirm('ลบคำตอบ?', `คุณแน่ใจหรือไม่ที่จะลบคำตอบที่ ${index + 1}?<br><small style="color: var(--txt3)">การกระทำนี้ไม่สามารถย้อนกลับได้</small>`)
                    .then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await onDeleteResponse(selForm, response.id);
                                setViewResp(null);
                                showSuccessAlert('ลบคำตอบแล้ว', 'คำตอบถูกลบเรียบร้อยแล้ว');
                            } catch (err) {
                                showErrorAlert('เกิดข้อผิดพลาด', err.message);
                            }
                        }
                    });
            };

            return (
                <div>
                    <div style={{ marginBottom: 18 }}>
                        <select className="form-input" value={selForm} onChange={e => setSelForm(e.target.value)} style={{ maxWidth: 320 }}>
                            {forms.length === 0 ? <option>— ยังไม่มีฟอร์ม —</option> : forms.map(f => <option key={f.id} value={f.id}>{f.title}</option>)}
                        </select>
                    </div>
                    {!form ? (
                        <div style={{ textAlign: 'center', padding: 60, color: 'var(--txt3)' }}>
                            <Icon name="inbox" size="3rem" style={{ marginBottom: 16 }} />
                            <div>เลือกฟอร์มเพื่อดูคำตอบ</div>
                        </div>
                    ) : resps.length === 0 ? (
                        <div style={{ textAlign: 'center', padding: 60, color: 'var(--txt3)' }}>
                            <Icon name="inbox" size="3rem" style={{ marginBottom: 16 }} />
                            <div style={{ fontWeight: 700 }}>ยังไม่มีคำตอบ</div>
                            <div style={{ marginTop: 8 }}>รอให้ผู้ใช้ส่งคำตอบมา~</div>
                        </div>
                    ) : (
                        <div className="stagger">
                            {resps.map((r, i) => (
                                <div key={r.id} className="card" style={{ padding: '14px 18px', marginBottom: 10, cursor: 'pointer' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <div onClick={() => setViewResp(r)} style={{ flex: 1 }}>
                                            <span style={{ fontWeight: 700 }}><Icon name="inbox" style={{ marginRight: 6 }} />คำตอบที่ {i + 1}</span>
                                            <span style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginLeft: 12 }}>
                                                <Icon name="clock-rotate-left" style={{ marginRight: 4 }} />{new Date(r.submittedAt).toLocaleString('th-TH')}
                                            </span>
                                        </div>
                                        <div style={{ display: 'flex', gap: 5 }}>
                                            <button className="btn-icon" onClick={() => setViewResp(r)}>
                                                <Icon name="chevron-right" style={{ color: 'var(--txt3)' }} />
                                            </button>
                                            <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }}
                                                onClick={(e) => { e.stopPropagation(); handleDelete(r); }}>
                                                <Icon name="trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {viewResp && form && (
                        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setViewResp(null)}>
                            <div className="modal-box card">
                                <div className="modal-title"><Icon name="file-lines" /> 📋 รายละเอียดคำตอบ</div>
                                <p style={{ color: 'var(--txt3)', fontSize: '0.82rem', marginBottom: 22 }}>ส่งเมื่อ {new Date(viewResp.submittedAt).toLocaleString('th-TH')}</p>
                                {(form.questions || []).map(q => (
                                    <div key={q.id} style={{ marginBottom: 14, padding: '12px 16px', background: 'var(--bg2)', borderRadius: 'var(--radius-sm)' }}>
                                        <p style={{ fontWeight: 700, fontSize: '0.76rem', color: 'var(--txt3)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 4 }}>{q.title}</p>
                                        <p style={{ fontWeight: 500, fontSize: '0.9rem' }}>
                                            {viewResp.data[q.id] || <em style={{ color: 'var(--txt3)' }}>ไม่ได้ตอบ</em>}
                                            {viewResp.fileUrls?.[q.id] && (
                                                <a href={viewResp.fileUrls[q.id]} target="_blank" rel="noopener noreferrer" style={{ display: 'block', color: 'var(--p3)', textDecoration: 'underline', marginTop: 4, fontSize: '0.8rem' }}>
                                                    📎 ดูไฟล์ที่อัปโหลด
                                                </a>
                                            )}
                                        </p>
                                    </div>
                                ))}
                                <div style={{ marginTop: 10, display: 'flex', gap: 10 }}>
                                    <button className="btn btn-ghost" onClick={() => setViewResp(null)}><Icon name="xmark" /> ปิด</button>
                                    <button className="btn btn-danger" onClick={() => handleDelete(viewResp)}>
                                        <Icon name="trash-can" /> ลบคำตอบนี้
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AnalyticsPage({ forms, responses }) {
            const [selForm, setSelForm] = useState(forms[0]?.id || '');
            const form = forms.find(f => f.id === selForm);
            const resps = responses[selForm] || [];
            const chartRefs = useRef({}), charts = useRef({});
            useEffect(() => {
                if (!form) return;
                (form.questions || []).filter(q => ['multiple', 'dropdown'].includes(q.type)).forEach(q => {
                    const canvas = chartRefs.current[q.id]; if (!canvas) return;
                    charts.current[q.id]?.destroy();
                    const counts = {}; (q.options || []).forEach(o => counts[o] = 0);
                    resps.forEach(r => { const v = r.data[q.id]; if (v && counts[v] !== undefined) counts[v]++; });
                    const style = getComputedStyle(document.documentElement);
                    const p1 = style.getPropertyValue('--p1').trim() || '#F8B4C8';
                    const p3 = style.getPropertyValue('--p3').trim() || '#E879A0';
                    charts.current[q.id] = new Chart(canvas, {
                        type: 'bar',
                        data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: `${p1}aa`, borderColor: p3, borderWidth: 2, borderRadius: 10 }] },
                        options: {
                            responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { color: 'var(--txt3)' }, grid: { color: 'rgba(128,128,128,0.06)' } }, x: { ticks: { color: 'var(--txt3)' }, grid: { display: false } } }
                        }
                    });
                });
                return () => Object.values(charts.current).forEach(c => c?.destroy());
            }, [selForm, resps]);
            return (
                <div>
                    <div style={{ marginBottom: 18 }}>
                        <select className="form-input" value={selForm} onChange={e => setSelForm(e.target.value)} style={{ maxWidth: 320 }}>
                            {forms.length === 0 ? <option>— ยังไม่มีฟอร์ม —</option> : forms.map(f => <option key={f.id} value={f.id}>{f.title}</option>)}
                        </select>
                    </div>
                    {!form ? (
                        <div style={{ textAlign: 'center', padding: 60, color: 'var(--txt3)' }}>
                            <Icon name="chart-pie" size="3rem" style={{ marginBottom: 16 }} />
                            <div>เลือกฟอร์มเพื่อดูการวิเคราะห์</div>
                        </div>
                    ) : (
                        <div className="stagger">
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 14, marginBottom: 20 }}>
                                {[
                                    { label: 'คำตอบทั้งหมด', val: resps.length, icon: 'inbox' },
                                    { label: 'จำนวนคำถาม', val: (form.questions || []).length, icon: 'circle-question' },
                                    { label: 'อัตราตอบครบ', val: `${resps.length > 0 ? Math.round(resps.filter(r => Object.keys(r.data).length === (form.questions || []).length).length / resps.length * 100) : 0}%`, icon: 'circle-check' },
                                ].map((s, i) => (
                                    <div key={i} className="card stat-card">
                                        <div style={{ fontSize: '1.4rem', marginBottom: 4 }}><Icon name={s.icon} size="1.4em" /></div>
                                        <div className="stat-number" style={{ fontSize: '2rem' }}>{s.val}</div>
                                        <div className="stat-label">{s.label}</div>
                                    </div>
                                ))}
                            </div>
                            {(form.questions || []).filter(q => ['multiple', 'dropdown'].includes(q.type)).map(q => (
                                <div key={q.id} className="card" style={{ padding: 22, marginBottom: 14 }}>
                                    <h4 style={{ fontWeight: 700, marginBottom: 18, color: 'var(--p3)', fontFamily: 'var(--font-display)' }}>{q.title}</h4>
                                    <div className="chart-wrap"><canvas ref={el => chartRefs.current[q.id] = el} /></div>
                                </div>
                            ))}
                            {(form.questions || []).filter(q => q.type === 'rating').map(q => {
                                const vals = resps.map(r => parseInt(r.data[q.id]) || 0).filter(v => v > 0);
                                const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
                                return (
                                    <div key={q.id} className="card" style={{ padding: 22, marginBottom: 14 }}>
                                        <h4 style={{ fontWeight: 700, marginBottom: 14, color: 'var(--p3)', fontFamily: 'var(--font-display)' }}>{q.title}</h4>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
                                            <div style={{ fontSize: '2.4rem', fontFamily: 'var(--font-display)', fontWeight: 800, color: 'var(--p3)' }}>{avg.toFixed(1)}</div>
                                            <div>
                                                <div style={{ display: 'flex', gap: 4 }}>
                                                    {[1, 2, 3, 4, 5].map(s => {
                                                        const filled = s <= Math.round(avg);
                                                        return <Icon key={s} name={filled ? 'star-filled' : 'star'} style={{ color: filled ? '#FFD060' : 'var(--border)', width: '1.2rem', height: '1.2rem' }} fill={filled} />
                                                    })}
                                                </div>
                                                <div style={{ color: 'var(--txt3)', fontSize: '0.82rem', marginTop: 4 }}>{vals.length} คะแนน</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function SettingsPage({ theme, onThemeChange, onLogout, updateSettings }) {
            const [oldPw, setOldPw] = useState('');
            const [newPw, setNewPw] = useState('');
            const [toast, setToast] = useState(null);
            const addRipple = useRipple();
            const GAS_URL_LOCAL = GAS_URL;

            const changePw = async () => {
                if (!oldPw) {
                    showErrorAlert('กรุณากรอกข้อมูล', '💔 กรุณากรอกรหัสผ่านเดิม');
                    return;
                }
                if (newPw.length < 6) {
                    showWarningAlert('รหัสผ่านสั้นเกินไป', '⚠️ รหัสผ่านต้องมีอย่างน้อย 6 ตัว');
                    return;
                }

                try {
                    // ตรวจสอบรหัสผ่านเดิม
                    const verifyResponse = await fetch(GAS_URL_LOCAL + '?action=verifyPassword&password=' + encodeURIComponent(oldPw));
                    const verifyResult = await verifyResponse.json();

                    if (!verifyResult.success) {
                        showErrorAlert('เปลี่ยนรหัสผ่านไม่สำเร็จ', '💔 รหัสผ่านเดิมไม่ถูกต้อง');
                        return;
                    }

                    const colors = getThemeColors();
                    const confirmResult = await Swal.fire({
                        title: 'เปลี่ยนรหัสผ่าน?',
                        text: 'คุณแน่ใจหรือไม่ที่จะเปลี่ยนรหัสผ่าน?',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: colors.p3,
                        cancelButtonColor: colors.txt2,
                        confirmButtonText: 'ใช่ เปลี่ยนเลย!',
                        cancelButtonText: 'ยกเลิก',
                        reverseButtons: true,
                        background: colors.card,
                        color: colors.txt,
                    });

                    if (confirmResult.isConfirmed) {
                        const result = await updateSettings({ adminPassword: newPw });

                        if (result.success) {
                            setOldPw('');
                            setNewPw('');
                            showSuccessAlert('เปลี่ยนรหัสผ่านสำเร็จ', '🌸 รหัสผ่านถูกเปลี่ยนเรียบร้อยแล้ว');
                        } else {
                            showErrorAlert('เกิดข้อผิดพลาด', result.message || 'ไม่สามารถเปลี่ยนรหัสผ่านได้');
                        }
                    }
                } catch (error) {
                    console.error('Change password error:', error);
                    showErrorAlert('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                }
            };

            const handleThemeChange = async (newTheme) => {
                onThemeChange(newTheme);
                try {
                    await updateSettings({ theme: newTheme });
                    const themeLabel = THEMES.find(t => t.id === newTheme)?.label || newTheme;
                    showSuccessAlert('เปลี่ยนธีมสำเร็จ', `เปลี่ยนเป็นธีม ${themeLabel} แล้ว!`);
                } catch (error) {
                    console.error('Theme change error:', error);
                }
            };

            const clearData = () => {
                showDeleteConfirm('⚠️ ลบข้อมูลทั้งหมด?', 'คุณแน่ใจหรือไม่ที่จะลบข้อมูลทั้งหมดจาก Google Sheets?<br><small style="color: #D04060">การกระทำนี้ไม่สามารถกู้คืนได้!</small>')
                    .then((result) => {
                        if (result.isConfirmed) {
                            showWarningAlert('คำเตือน', 'กรุณาลบข้อมูลผ่าน Google Sheets โดยตรง หรือใช้เมนูใน Spreadsheet');
                        }
                    });
            };

            const handleLogout = () => {
                const colors = getThemeColors();
                Swal.fire({
                    title: 'ออกจากระบบ?',
                    text: 'คุณแน่ใจหรือไม่ที่จะออกจากระบบ?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: '🚪 ใช่ ออกจากระบบ',
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then((result) => {
                    if (result.isConfirmed) {
                        onLogout();
                    }
                });
            };

            return (
                <div className="stagger">
                    {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

                    <div className="card" style={{ padding: 26, marginBottom: 14 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: 'var(--p3)', marginBottom: 20 }}>
                            <div style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, var(--p1), var(--p3))', color: 'white' }}><Icon name="chart-pie" /></div>
                            ธีมและสีสัน
                        </div>
                        <ThemePicker currentTheme={theme} onThemeChange={handleThemeChange} />
                    </div>

                    <div className="card" style={{ padding: 26, marginBottom: 14 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: 'var(--p3)', marginBottom: 20 }}>
                            <div style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, var(--p1), var(--p3))', color: 'white' }}><Icon name="key" /></div>
                            เปลี่ยนรหัสผ่าน
                        </div>
                        <div className="form-field">
                            <label>รหัสผ่านเดิม</label>
                            <input type="password" className="form-input" value={oldPw} onChange={e => setOldPw(e.target.value)} placeholder="••••••••" />
                        </div>
                        <div className="form-field">
                            <label>รหัสผ่านใหม่</label>
                            <input type="password" className="form-input" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="อย่างน้อย 6 ตัวอักษร" />
                        </div>
                        <button className="btn btn-primary ripple" onClick={e => { addRipple(e); changePw(); }}><Icon name="key" /> บันทึกรหัสผ่านใหม่</button>
                    </div>

                    <div className="card" style={{ padding: 26, marginBottom: 14 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: 'var(--p3)', marginBottom: 20 }}>
                            <div style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, var(--p1), var(--p3))', color: 'white' }}><Icon name="cloud" /></div>
                            🔗 Google Sheets Connection
                        </div>
                        <p style={{ color: 'var(--txt2)', fontSize: '0.84rem', marginBottom: 16 }}>
                            ✅ ข้อมูลทั้งหมดบันทึกใน Google Sheets ผ่าน Google Apps Script
                        </p>
                        <div className="url-box" style={{ marginBottom: 16 }}>
                            <span style={{ flex: 1, overflowX: 'auto', whiteSpace: 'nowrap', fontSize: '0.75rem' }}>{GAS_URL_LOCAL}</span>
                        </div>
                        <button className="btn btn-ghost" onClick={() => window.open(GAS_URL_LOCAL + '?action=getStats', '_blank')}>
                            <Icon name="arrow-up-right-from-square" /> ทดสอบการเชื่อมต่อ
                        </button>
                    </div>

                    <div className="card" style={{ padding: 26, marginBottom: 14, border: '2px solid rgba(208,64,96,0.2)' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: '#D04060', marginBottom: 20 }}>
                            <div style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg,#FFAAB0,#FF6070)', color: 'white' }}><Icon name="triangle-exclamation" /></div>
                            โซนอันตราย
                        </div>
                        <p style={{ color: 'var(--txt3)', fontSize: '0.84rem', marginBottom: 18 }}>การลบข้อมูลต้องทำผ่าน Google Sheets โดยตรง</p>
                        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                            <button className="btn btn-danger ripple" onClick={e => { addRipple(e); clearData(); }}><Icon name="trash-can" /> วิธีลบข้อมูล</button>
                            <button className="btn btn-ghost" onClick={handleLogout} style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }}>
                                <Icon name="arrow-right-from-bracket" /> ออกจากระบบ
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function BottomNav({ page, setPage }) {
            const items = [
                { id: 'dashboard', icon: 'house-chimney', label: 'หน้าแรก' },
                { id: 'forms', icon: 'file-heart', label: 'ฟอร์ม' },
                { id: 'responses', icon: 'inbox', label: 'คำตอบ' },
                { id: 'analytics', icon: 'chart-pie', label: 'วิเคราะห์' },
                { id: 'settings', icon: 'sliders', label: 'ตั้งค่า' },
            ];
            return (
                <nav className="bottom-nav">
                    <div className="bottom-nav-items">
                        {items.map(item => (
                            <div key={item.id} className={`bottom-nav-item ${page === item.id ? 'active' : ''}`} onClick={() => setPage(item.id)}>
                                <div className="nav-icon-wrap"><Icon name={item.icon} /></div>
                                <span>{item.label}</span>
                            </div>
                        ))}
                    </div>
                </nav>
            );
        }

        function PublicForm({ form, onSubmit }) {
            const [answers, setAnswers] = useState({});
            const [stars, setStars] = useState({});
            const [hover, setHover] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [errors, setErrors] = useState({});
            const [fileUrls, setFileUrls] = useState({});
            const [uploading, setUploading] = useState({});
            const addRipple = useRipple();

            if (!form) return (
                <div style={{ textAlign: 'center', padding: 80 }}>
                    <span style={{ fontSize: '4rem' }}>🌸</span>
                    <h2 style={{ fontFamily: 'var(--font-display)', color: 'var(--p3)', marginTop: 12 }}>ไม่พบฟอร์มนี้</h2>
                </div>
            );
            if (!form.active) return (
                <div style={{ textAlign: 'center', padding: 80 }}>
                    <span style={{ fontSize: '4rem' }}>🔒</span>
                    <h2 style={{ marginTop: 12 }}>ฟอร์มปิดรับคำตอบ</h2>
                </div>
            );
            if (submitted) return (
                <div className="public-wrap" style={{ alignItems: 'center', justifyContent: 'center' }}>
                    <div style={{ textAlign: 'center', background: 'var(--card)', padding: 48, borderRadius: 40, maxWidth: 400, width: '100%' }}>
                        <span style={{ fontSize: '4rem' }}>🎉🌸</span>
                        <h2 style={{ fontFamily: 'var(--font-display)', color: 'var(--p3)', margin: '12px 0' }}>ส่งคำตอบแล้ว!</h2>
                        <p style={{ color: 'var(--txt2)', marginBottom: 24 }}>ขอบคุณที่ตอบแบบสอบถาม~</p>
                        <button className="btn btn-primary ripple" onClick={e => {
                            addRipple(e);
                            setSubmitted(false);
                            setAnswers({});
                            setStars({});
                            setFileUrls({});
                        }}>
                            <Icon name="paper-plane" /> ตอบอีกครั้ง
                        </button>
                    </div>
                </div>
            );

            const accent = form.accentColor || 'var(--p3)';

            const handleFileUpload = async (questionId, file) => {
                if (!file) return;
                setUploading(prev => ({ ...prev, [questionId]: true }));

                try {
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const base64Content = event.target.result.split(',')[1];
                            const response = await fetch(GAS_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: 'uploadFile',
                                    data: {
                                        formId: form.id,
                                        formTitle: form.title,
                                        questionId: questionId,
                                        fileName: file.name,
                                        fileContent: base64Content,
                                        mimeType: file.type || 'application/octet-stream'
                                    }
                                })
                            });

                            const result = await response.json();
                            if (result.success) {
                                setFileUrls(prev => ({ ...prev, [questionId]: result.data.fileUrl }));
                                setAnswers(a => ({ ...a, [questionId]: file.name }));
                                showSuccessAlert('อัปโหลดสำเร็จ! 🎉', `ไฟล์ "${file.name}" อัปโหลดเรียบร้อยแล้ว`);
                            } else {
                                showErrorAlert('อัปโหลดล้มเหลว', result.message || 'เกิดข้อผิดพลาดในการอัปโหลด');
                            }
                        } catch (error) {
                            console.error('❌ Upload error:', error);
                            showErrorAlert('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการอัปโหลด: ' + error.message);
                        } finally {
                            setUploading(prev => ({ ...prev, [questionId]: false }));
                        }
                    };
                    reader.onerror = () => {
                        showErrorAlert('ข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ได้');
                        setUploading(prev => ({ ...prev, [questionId]: false }));
                    };
                    reader.readAsDataURL(file);
                } catch (error) {
                    console.error('❌ Upload error:', error);
                    showErrorAlert('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการอัปโหลด: ' + error.message);
                    setUploading(prev => ({ ...prev, [questionId]: false }));
                }
            };

            const handleSubmit = () => {
                const errs = {};
                (form.questions || []).forEach(q => {
                    if (q.required && !answers[q.id] && !stars[q.id] && q.type !== 'upload') {
                        errs[q.id] = '🌸 กรุณาตอบด้วยนะ';
                    }
                    if (q.required && q.type === 'upload' && !fileUrls[q.id]) {
                        errs[q.id] = '📁 กรุณาอัปโหลดไฟล์ด้วยนะ';
                    }
                });

                if (Object.keys(errs).length) {
                    setErrors(errs);
                    showWarningAlert('กรุณากรอกข้อมูลให้ครบ', 'มีคำถามที่จำเป็นยังไม่ได้ตอบนะคะ~');
                    return;
                }

                const combined = { ...answers };
                Object.entries(stars).forEach(([k, v]) => combined[k] = `${v}/5`);
                onSubmit(form.id, combined, fileUrls);

                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#90C8F0', '#FFE070']
                });
                setSubmitted(true);

                const colors = getThemeColors();
                Swal.fire({
                    title: '🎉 ส่งคำตอบสำเร็จ!',
                    text: 'ขอบคุณที่ตอบแบบสอบถามนะคะ~',
                    icon: 'success',
                    confirmButtonColor: colors.p3,
                    background: colors.card,
                    color: colors.txt,
                    timer: 3000,
                    timerProgressBar: true,
                });
            };

            return (
                <div className="public-wrap" style={{ background: form.bgColor || 'var(--bg)' }}>
                    <div className="public-card card">
                        <div style={{ textAlign: 'center', marginBottom: 18 }}>
                            {form.headerImage?.startsWith('http') ?
                                <img src={form.headerImage} style={{ maxWidth: '100%', borderRadius: 20, marginBottom: 12 }} alt="" /> :
                                <span style={{ fontSize: '3rem' }}>{form.headerImage || '🌸'}</span>
                            }
                        </div>
                        <h1 style={{ fontFamily: 'var(--font-display)', color: accent, textAlign: 'center', marginBottom: 8 }}>
                            {form.title}
                        </h1>
                        {form.description &&
                            <p style={{ color: 'var(--txt2)', textAlign: 'center', marginBottom: 20 }}>
                                {form.description}
                            </p>
                        }
                        <div className="divider" />

                        {(form.questions || []).map(q => (
                            <div key={q.id} style={{ marginBottom: 22 }}>
                                <p style={{ fontWeight: 700, marginBottom: 8, fontSize: '0.95rem' }}>
                                    {q.title} {q.required && <span style={{ color: '#D04060' }}>*</span>}
                                </p>
                                {errors[q.id] &&
                                    <div style={{ color: '#D04060', fontSize: '0.82rem', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <Icon name="circle-exclamation" /> {errors[q.id]}
                                    </div>
                                }

                                {q.type === 'short' &&
                                    <input className="form-input" placeholder={q.placeholder}
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}
                                    />
                                }

                                {q.type === 'paragraph' &&
                                    <textarea className="form-input" rows={3} placeholder={q.placeholder}
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}
                                    />
                                }

                                {q.type === 'multiple' && (q.options || []).map(opt => (
                                    <div key={opt}
                                        className={`custom-radio ${answers[q.id] === opt ? 'selected' : ''}`}
                                        onClick={() => {
                                            setAnswers(a => ({ ...a, [q.id]: opt }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}>
                                        <div className="radio-dot" /> {opt}
                                    </div>
                                ))}

                                {q.type === 'dropdown' && (
                                    <select className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}>
                                        <option value="">-- เลือก --</option>
                                        {(q.options || []).map(o => <option key={o} value={o}>{o}</option>)}
                                    </select>
                                )}

                                {q.type === 'upload' && (
                                    <div style={{ border: '2px dashed var(--border)', borderRadius: 20, padding: 24 }}>
                                        <input
                                            type="file"
                                            id={`file-${q.id}`}
                                            style={{ display: 'none' }}
                                            onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (file) handleFileUpload(q.id, file);
                                            }}
                                        />
                                        <div style={{ textAlign: 'center', color: 'var(--txt3)' }}>
                                            <Icon name="cloud-upload-alt" style={{ fontSize: '2rem', marginBottom: 8, display: 'block', color: 'var(--p1)' }} />
                                            {uploading[q.id] ? (
                                                <div>
                                                    <Icon name="spinner" size="2rem" style={{ color: 'var(--p3)', marginBottom: 8 }} />
                                                    <p style={{ color: 'var(--p3)', fontWeight: 600 }}>กำลังอัปโหลด... ⏳</p>
                                                </div>
                                            ) : fileUrls[q.id] ? (
                                                <div>
                                                    <p style={{ color: '#2BAF88', fontWeight: 600, marginBottom: 8 }}>✅ อัปโหลดไฟล์สำเร็จ!</p>
                                                    <p style={{ fontSize: '0.85rem', marginBottom: 4, color: 'var(--txt2)' }}>📄 {answers[q.id] || 'ไฟล์ของคุณ'}</p>
                                                    <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 8, flexWrap: 'wrap' }}>
                                                        <a href={fileUrls[q.id]} target="_blank" rel="noopener noreferrer"
                                                            className="btn btn-ghost"
                                                            style={{ padding: '6px 12px', fontSize: '0.8rem', textDecoration: 'none' }}>
                                                            <Icon name="arrow-up-right-from-square" /> ดูไฟล์
                                                        </a>
                                                        <button className="btn btn-ghost"
                                                            style={{ padding: '6px 12px', fontSize: '0.8rem' }}
                                                            onClick={() => {
                                                                setFileUrls(prev => { const newUrls = { ...prev }; delete newUrls[q.id]; return newUrls; });
                                                                setAnswers(prev => { const newAnswers = { ...prev }; delete newAnswers[q.id]; return newAnswers; });
                                                            }}>
                                                            <Icon name="xmark" /> ลบและเลือกใหม่
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div>
                                                    <button className="btn btn-ghost"
                                                        style={{ marginBottom: 8 }}
                                                        onClick={() => document.getElementById(`file-${q.id}`).click()}>
                                                        <Icon name="cloud-upload-alt" /> เลือกไฟล์เพื่ออัปโหลด
                                                    </button>
                                                    <p style={{ fontSize: '0.8rem' }}>📁 รองรับไฟล์ทุกประเภท (สูงสุด 50MB)</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {q.type === 'rating' && (
                                    <div className="star-rating">
                                        {[1, 2, 3, 4, 5].map(s => {
                                            const current = hover[q.id] || stars[q.id] || 0;
                                            const filled = s <= current;
                                            return (
                                                <span key={s} className="star"
                                                    style={{ color: filled ? '#FFD060' : 'var(--border)', display: 'inline-flex' }}
                                                    onMouseEnter={() => setHover(h => ({ ...h, [q.id]: s }))}
                                                    onMouseLeave={() => setHover(h => ({ ...h, [q.id]: 0 }))}
                                                    onClick={() => {
                                                        setStars(st => ({ ...st, [q.id]: s }));
                                                        setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                                    }}>
                                                    <Icon name={filled ? 'star-filled' : 'star'}
                                                        style={{ width: '1.3rem', height: '1.3rem' }} fill={filled} />
                                                </span>
                                            );
                                        })}
                                        {stars[q.id] && <span style={{ marginLeft: 8, fontWeight: 600 }}>{stars[q.id]}/5</span>}
                                    </div>
                                )}

                                {q.type === 'date' &&
                                    <input type="date" className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}
                                    />
                                }

                                {q.type === 'time' &&
                                    <input type="time" className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            setErrors(prev => ({ ...prev, [q.id]: undefined }));
                                        }}
                                    />
                                }
                            </div>
                        ))}

                        <div className="divider" />
                        <button className="btn btn-primary ripple"
                            style={{ width: '100%', justifyContent: 'center', padding: '14px', fontSize: '0.96rem' }}
                            onClick={e => { addRipple(e); handleSubmit(); }}>
                            <Icon name="paper-plane" /> ส่งคำตอบ 🌸
                        </button>
                        <p style={{ textAlign: 'center', color: 'var(--txt3)', fontSize: '0.76rem', marginTop: 12 }}>
                            สร้างด้วย <strong style={{ color: 'var(--p3)' }}>FormFlow</strong> (Sheet-based)
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            const [loggedIn, setLoggedIn] = useState(() => sessionStorage.getItem('ff_auth') === '1');
            const [page, setPage] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [theme, setTheme] = useState('sakura');
            const [toast, setToast] = useState(null);
            const [urlModal, setUrlModal] = useState(null);
            const [showScroll, setShowScroll] = useState(false);

            const {
                forms, responses, loading, error,
                addForm, updateForm, deleteForm, toggleFormActive,
                addResponse, deleteResponse, updateSettings, verifyPassword, loadAllData
            } = useStore();

            const params = new URLSearchParams(location.search);
            const publicFormId = params.get('form');

            useEffect(() => { applyTheme(theme); }, [theme]);

            useEffect(() => {
                const h = () => setShowScroll(scrollY > 300);
                addEventListener('scroll', h);
                return () => removeEventListener('scroll', h);
            }, []);

            const handleLogin = () => {
                sessionStorage.setItem('ff_auth', '1');
                setLoggedIn(true);
                showSuccessAlert('เข้าสู่ระบบสำเร็จ!', 'ยินดีต้อนรับสู่ FormFlow นะคะ~ 🌸');
            };

            const handleLogout = () => {
                sessionStorage.removeItem('ff_auth');
                setLoggedIn(false);
            };

            const handleThemeChange = async (t) => {
                setTheme(t);
                applyTheme(t);
                try {
                    await updateSettings({ theme: t });
                } catch (err) {
                    console.error('Theme sync error:', err);
                }
            };

            const pageTitles = {
                dashboard: <><Icon name="house-chimney" /> แดชบอร์ด</>,
                forms: <><Icon name="file-heart" /> ฟอร์มทั้งหมด</>,
                responses: <><Icon name="inbox" /> คำตอบ</>,
                analytics: <><Icon name="chart-pie" /> วิเคราะห์</>,
                settings: <><Icon name="sliders" /> ตั้งค่า</>
            };

            if (publicFormId) {
                const form = forms.find(f => f.id === publicFormId);
                return <PublicForm form={form} onSubmit={addResponse} />;
            }

            if (!loggedIn) return <LoginScreen onLogin={handleLogin} verifyPassword={verifyPassword} />;
            if (loading) return <LoadingScreen />;

            return (
                <>
                    <ScrollProgress />
                    <FloatingDecorations />
                    {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
                    {urlModal && <UrlModal form={urlModal} onClose={() => setUrlModal(null)} />}
                    <Sidebar page={page} setPage={setPage} open={sidebarOpen} onClose={() => setSidebarOpen(false)} onLogout={handleLogout} />
                    <main className="main-content">
                        <TopBar
                            title={pageTitles[page] || 'FormFlow'}
                            onMenuClick={() => setSidebarOpen(!sidebarOpen)}
                            theme={theme}
                            onThemeChange={handleThemeChange}
                            onLogout={handleLogout}
                        />
                        {error && (
                            <div className="card" style={{ padding: 16, marginBottom: 20, background: 'rgba(255,96,112,0.1)', borderColor: 'rgba(208,64,96,0.3)', color: '#D04060' }}>
                                <Icon name="triangle-exclamation" /> {error}
                                <button className="btn btn-ghost" style={{ marginLeft: 12 }} onClick={loadAllData}>ลองใหม่</button>
                            </div>
                        )}
                        {page === 'dashboard' && <DashboardPage forms={forms} responses={responses} />}
                        {page === 'forms' && (
                            <FormsPage forms={forms} responses={responses}
                                onAdd={addForm}
                                onEdit={updateForm}
                                onDelete={deleteForm}
                                onToggle={toggleFormActive}
                                onViewUrl={f => setUrlModal(f)}
                            />
                        )}
                        {page === 'responses' && <ResponsesPage forms={forms} responses={responses} onDeleteResponse={deleteResponse} />}
                        {page === 'analytics' && <AnalyticsPage forms={forms} responses={responses} />}
                        {page === 'settings' && <SettingsPage theme={theme} onThemeChange={handleThemeChange} onLogout={handleLogout} updateSettings={updateSettings} />}
                    </main>
                    <BottomNav page={page} setPage={setPage} />
                    <div className={`scroll-top-btn ${showScroll ? 'visible' : ''}`} onClick={() => scrollTo({ top: 0, behavior: 'smooth' })}>
                        <Icon name="arrow-up" />
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
