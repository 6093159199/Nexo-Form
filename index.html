                                            <button className="btn-icon" title="ดูตัวอย่าง" onClick={() => setPreviewFile(file)}>
                                                <Icon name="eye" />
                                            </button>
                                            <button className="btn-icon" title="ดาวน์โหลด" onClick={() => downloadFileFromGAS(file.id, file.name)}>
                                                <Icon name="download" />
                                            </button>
                                            <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} title="ลบ"
                                                onClick={() => handleDeleteFile(file)}>
                                                <Icon name="trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {previewFile && <FilePreviewModal fileInfo={previewFile} onClose={() => setPreviewFile(null)} />}
                </div>
            );
        }

        function SettingsPage({ theme, onThemeChange, onLogout }) {
            const [oldPw, setOldPw] = useState(''); const [newPw, setNewPw] = useState('');
            const [toast, setToast] = useState(null);
            const [settingsLoading, setSettingsLoading] = useState(false);
            const addRipple = useRipple();

            useEffect(() => {
                gasGet({ action: 'getAll' }).then(data => {
                    if (data.settings?.adminpw) {
                        sessionStorage.setItem('ff_adminpw_cache', data.settings.adminpw);
                    }
                }).catch(() => { });
            }, []);

            const changePw = () => {
                const cur = sessionStorage.getItem('ff_adminpw_cache') || 'admin1234';
                if (oldPw !== cur) {
                    showErrorAlert('เปลี่ยนรหัสผ่านไม่สำเร็จ', '💔 รหัสผ่านเดิมไม่ถูกต้อง');
                    return;
                }
                if (newPw.length < 6) {
                    showWarningAlert('รหัสผ่านสั้นเกินไป', '⚠️ รหัสผ่านต้องมีอย่างน้อย 6 ตัว');
                    return;
                }

                const colors = getThemeColors();
                Swal.fire({
                    title: 'เปลี่ยนรหัสผ่าน?',
                    text: 'คุณแน่ใจหรือไม่ที่จะเปลี่ยนรหัสผ่าน?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: 'ใช่ เปลี่ยนเลย!',
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        setSettingsLoading(true);
                        try {
                            const existing = await gasGet({ action: 'getAll' });
                            const settings = existing.settings || {};
                            settings.adminpw = newPw;
                            await gasPost({ action: 'saveSettings', settings });
                            sessionStorage.setItem('ff_adminpw_cache', newPw);
                            setOldPw('');
                            setNewPw('');
                            showSuccessAlert('เปลี่ยนรหัสผ่านสำเร็จ', '🌸 รหัสผ่านถูกบันทึกลง Google Sheets แล้ว');
                        } catch (e) {
                            showErrorAlert('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกลง Google Sheets ได้');
                        } finally {
                            setSettingsLoading(false);
                        }
                    }
                });
            };

            const clearData = () => {
                showDeleteConfirm('⚠️ ลบข้อมูลทั้งหมด?', 'คุณแน่ใจหรือไม่ที่จะลบข้อมูลทั้งหมด?<br><small style="color: #D04060">การกระทำนี้ไม่สามารถกู้คืนได้!</small>')
                    .then(async (result) => {
                        if (result.isConfirmed) {
                            await gasPost({ action: 'saveAll', forms: [], responses: {}, settings: {} });
                            showSuccessAlert('ลบข้อมูลแล้ว', 'ข้อมูลทั้งหมดถูกลบจาก Google Sheets แล้ว กำลังรีเฟรช...');
                            setTimeout(() => location.reload(), 1500);
                        }
                    });
            };

            const handleLogout = () => {
                const colors = getThemeColors();
                Swal.fire({
                    title: 'ออกจากระบบ?',
                    text: 'คุณแน่ใจหรือไม่ที่จะออกจากระบบ?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: '🚪 ใช่ ออกจากระบบ',
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then((result) => {
                    if (result.isConfirmed) {
                        onLogout();
                    }
                });
            };

            return (
                <div className="stagger">
                    {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

                    <div className="card" style={{ padding: 26, marginBottom: 14 }}>
                        <div className="settings-card-header" style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: 'var(--p3)', marginBottom: 20 }}>
                            <div className="settings-icon" style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, var(--p1), var(--p3))', color: 'white', fontSize: '0.9rem' }}><Icon name="chart-pie" /></div>
                            ธีมและสีสัน
                        </div>
                        <ThemePicker currentTheme={theme} onThemeChange={onThemeChange} accent={''} onAccentChange={() => { }} />
                    </div>

                    <div className="card" style={{ padding: 26, marginBottom: 14 }}>
                        <div className="settings-card-header" style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: 'var(--p3)', marginBottom: 20 }}>
                            <div className="settings-icon" style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, var(--p1), var(--p3))', color: 'white', fontSize: '0.9rem' }}><Icon name="key" /></div>
                            เปลี่ยนรหัสผ่าน
                        </div>
                        <div className="form-field">
                            <label>รหัสผ่านเดิม</label>
                            <input type="password" className="form-input" value={oldPw} onChange={e => setOldPw(e.target.value)} placeholder="••••••••" />
                        </div>
                        <div className="form-field">
                            <label>รหัสผ่านใหม่</label>
                            <input type="password" className="form-input" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="อย่างน้อย 6 ตัวอักษร" />
                        </div>
                        <button className="btn btn-primary ripple" onClick={e => { addRipple(e); changePw(); }} disabled={settingsLoading}>
                            {settingsLoading ? <><Icon name="spinner" /> กำลังบันทึก...</> : <><Icon name="key" /> บันทึกรหัสผ่านใหม่</>}
                        </button>
                    </div>

                    <div className="card" style={{ padding: 26, marginBottom: 14, border: '2px solid rgba(208,64,96,0.2)' }}>
                        <div className="settings-card-header" style={{ display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.02rem', color: '#D04060', marginBottom: 20 }}>
                            <div className="settings-icon" style={{ width: 36, height: 36, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg,#FFAAB0,#FF6070)', color: 'white', fontSize: '0.9rem' }}><Icon name="triangle-exclamation" /></div>
                            โซนอันตราย
                        </div>
                        <p style={{ color: 'var(--txt3)', fontSize: '0.84rem', marginBottom: 18 }}>การลบข้อมูลจะไม่สามารถกู้คืนได้</p>
                        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                            <button className="btn btn-danger ripple" onClick={e => { addRipple(e); clearData(); }}><Icon name="trash-can" /> ลบข้อมูลทั้งหมด</button>
                            <button className="btn btn-ghost" onClick={handleLogout} style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }}>
                                <Icon name="arrow-right-from-bracket" /> ออกจากระบบ
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // =====================
        // PUBLIC FORM COMPONENT
        // =====================
        function PublicForm({ form, onSubmit }) {
            const [answers, setAnswers] = useState({});
            const [stars, setStars] = useState({});
            const [hover, setHover] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [errors, setErrors] = useState({});
            const [uploading, setUploading] = useState({});
            const [uploadProgress, setUploadProgress] = useState({});
            const addRipple = useRipple();

            const uploadFile = async (questionId, file) => {
                const q = (form.questions || []).find(q => q.id === questionId);
                const maxSize = q?.maxFileSize || MAX_FILE_SIZE;

                if (file.size > maxSize) {
                    showErrorAlert('ไฟล์ใหญ่เกินไป', `ขนาดไฟล์ต้องไม่เกิน ${formatFileSize(maxSize)} นะคะ`);
                    return;
                }

                setUploading(prev => ({ ...prev, [questionId]: true }));
                setUploadProgress(prev => ({ ...prev, [questionId]: 0 }));

                try {
                    const result = await uploadFileToGAS(form.id, questionId, file);
                    setUploadProgress(prev => ({ ...prev, [questionId]: 100 }));

                    if (result.error) {
                        showErrorAlert('อัปโหลดไม่สำเร็จ', result.message || result.error);
                        return;
                    }

                    setAnswers(a => ({ ...a, [questionId]: JSON.stringify(result) }));
                    setErrors(prev => {
                        const newErrors = { ...prev };
                        delete newErrors[questionId];
                        return newErrors;
                    });
                    showToast('success', 'อัปโหลดไฟล์สำเร็จ! 📁');
                } catch (err) {
                    showErrorAlert('เกิดข้อผิดพลาด', 'ไม่สามารถอัปโหลดไฟล์ได้ กรุณาลองใหม่');
                } finally {
                    setUploading(prev => ({ ...prev, [questionId]: false }));
                    setTimeout(() => setUploadProgress(prev => ({ ...prev, [questionId]: 0 })), 1000);
                }
            };

            if (!form) return (
                <div style={{ textAlign: 'center', padding: 80 }}>
                    <span style={{ fontSize: '4rem' }}>🌸</span>
                    <h2 style={{ fontFamily: 'var(--font-display)', color: 'var(--p3)', marginTop: 12 }}>ไม่พบฟอร์มนี้</h2>
                </div>
            );
            if (!form.active) return (
                <div style={{ textAlign: 'center', padding: 80 }}>
                    <span style={{ fontSize: '4rem' }}>🔒</span>
                    <h2 style={{ marginTop: 12 }}>ฟอร์มปิดรับคำตอบ</h2>
                </div>
            );
            if (submitted) return (
                <div className="public-wrap" style={{ alignItems: 'center', justifyContent: 'center' }}>
                    <div style={{ textAlign: 'center', background: 'var(--card)', padding: 48, borderRadius: 40, maxWidth: 400, width: '100%' }}>
                        <span style={{ fontSize: '4rem' }}>🎉🌸</span>
                        <h2 style={{ fontFamily: 'var(--font-display)', color: 'var(--p3)', margin: '12px 0' }}>ส่งคำตอบแล้ว!</h2>
                        <p style={{ color: 'var(--txt2)', marginBottom: 24 }}>ขอบคุณที่ตอบแบบสอบถาม~</p>
                        <button className="btn btn-primary ripple" onClick={e => {
                            addRipple(e);
                            setSubmitted(false);
                            setAnswers({});
                            setStars({});
                        }}>
                            <Icon name="paper-plane" /> ตอบอีกครั้ง
                        </button>
                    </div>
                </div>
            );

            const accent = form.accentColor || 'var(--p3)';

            const handleSubmit = () => {
                const errs = {};
                (form.questions || []).forEach(q => {
                    if (q.required) {
                        const answer = answers[q.id];
                        if (q.type === 'file') {
                            if (!answer) errs[q.id] = '🌸 กรุณาอัปโหลดไฟล์ด้วยนะ';
                        } else if (q.type === 'rating') {
                            if (!stars[q.id]) errs[q.id] = '🌸 กรุณาให้คะแนนด้วยนะ';
                        } else if (!answer) {
                            errs[q.id] = '🌸 กรุณาตอบด้วยนะ';
                        }
                    }
                });

                if (Object.keys(errs).length) {
                    setErrors(errs);
                    showWarningAlert('กรุณากรอกข้อมูลให้ครบ', 'มีคำถามที่จำเป็นยังไม่ได้ตอบนะคะ~');
                    return;
                }

                const combined = { ...answers };
                Object.entries(stars).forEach(([k, v]) => {
                    if (v) combined[k] = `${v}/5`;
                });

                onSubmit(form.id, combined);

                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#90C8F0', '#FFE070']
                });
                setSubmitted(true);

                const colors = getThemeColors();
                Swal.fire({
                    title: '🎉 ส่งคำตอบสำเร็จ!',
                    text: 'ขอบคุณที่ตอบแบบสอบถามนะคะ~',
                    icon: 'success',
                    confirmButtonColor: colors.p3,
                    background: colors.card,
                    color: colors.txt,
                    timer: 3000,
                    timerProgressBar: true,
                });
            };

            return (
                <div className="public-wrap" style={{ background: form.bgColor || 'var(--bg)' }}>
                    <div className="public-card card">
                        <div style={{ textAlign: 'center', marginBottom: 18 }}>
                            {form.headerImage?.startsWith('http') ?
                                <img src={form.headerImage} style={{ maxWidth: '100%', borderRadius: 20, marginBottom: 12 }} alt="" /> :
                                <span style={{ fontSize: '3rem' }}>{form.headerImage || '🌸'}</span>
                            }
                        </div>
                        <h1 style={{ fontFamily: 'var(--font-display)', color: accent, textAlign: 'center', marginBottom: 8 }}>
                            {form.title}
                        </h1>
                        {form.description &&
                            <p style={{ color: 'var(--txt2)', textAlign: 'center', marginBottom: 20 }}>
                                {form.description}
                            </p>
                        }
                        <div className="divider" />

                        {(form.questions || []).map(q => (
                            <div key={q.id} style={{ marginBottom: 22 }}>
                                <p style={{ fontWeight: 700, marginBottom: 8, fontSize: '0.95rem' }}>
                                    <Icon name={QUESTION_TYPES.find(t => t.value === q.type)?.icon || 'circle-question'} style={{ marginRight: 6 }} />
                                    {q.title} {q.required && <span style={{ color: '#D04060' }}>*</span>}
                                </p>
                                {errors[q.id] &&
                                    <div style={{ color: '#D04060', fontSize: '0.82rem', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 5 }}>
                                        <Icon name="circle-exclamation" /> {errors[q.id]}
                                    </div>
                                }

                                {/* Short text */}
                                {q.type === 'short' &&
                                    <input className="form-input" placeholder={q.placeholder}
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}
                                    />
                                }

                                {/* Paragraph */}
                                {q.type === 'paragraph' &&
                                    <textarea className="form-input" rows={3} placeholder={q.placeholder}
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}
                                    />
                                }

                                {/* Multiple choice */}
                                {q.type === 'multiple' && (q.options || []).map(opt => (
                                    <div key={opt}
                                        className={`custom-radio ${answers[q.id] === opt ? 'selected' : ''}`}
                                        onClick={() => {
                                            setAnswers(a => ({ ...a, [q.id]: opt }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}>
                                        <div className="radio-dot" /> {opt}
                                    </div>
                                ))}

                                {/* Dropdown */}
                                {q.type === 'dropdown' && (
                                    <select className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}>
                                        <option value="">-- เลือก --</option>
                                        {(q.options || []).map(o => <option key={o} value={o}>{o}</option>)}
                                    </select>
                                )}

                                {/* Rating */}
                                {q.type === 'rating' && (
                                    <div className="star-rating">
                                        {[1, 2, 3, 4, 5].map(s => {
                                            const current = hover[q.id] || stars[q.id] || 0;
                                            const filled = s <= current;
                                            return (
                                                <span key={s}
                                                    className="star"
                                                    style={{ color: filled ? '#FFD060' : 'var(--border)', display: 'inline-flex' }}
                                                    onMouseEnter={() => setHover(h => ({ ...h, [q.id]: s }))}
                                                    onMouseLeave={() => setHover(h => ({ ...h, [q.id]: 0 }))}
                                                    onClick={() => {
                                                        setStars(st => ({ ...st, [q.id]: s }));
                                                        if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                                    }}>
                                                    <Icon name={filled ? 'star-filled' : 'star'}
                                                        style={{ width: '1.3rem', height: '1.3rem' }}
                                                        fill={filled}
                                                    />
                                                </span>
                                            );
                                        })}
                                        {stars[q.id] && <span style={{ marginLeft: 8, fontWeight: 600 }}>{stars[q.id]}/5</span>}
                                    </div>
                                )}

                                {/* Date */}
                                {q.type === 'date' &&
                                    <input type="date" className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}
                                    />
                                }

                                {/* Time */}
                                {q.type === 'time' &&
                                    <input type="time" className="form-input"
                                        value={answers[q.id] || ''}
                                        onChange={e => {
                                            setAnswers(a => ({ ...a, [q.id]: e.target.value }));
                                            if (errors[q.id]) setErrors(prev => { const n = { ...prev }; delete n[q.id]; return n; });
                                        }}
                                    />
                                }

                                {/* File Upload */}
                                {q.type === 'file' && (
                                    <div>
                                        {answers[q.id] ? (
                                            (() => {
                                                let fileInfo;
                                                try { fileInfo = JSON.parse(answers[q.id]); } catch (e) { fileInfo = null; }
                                                return fileInfo ? (
                                                    <div className="card" style={{ padding: 14, background: 'var(--bg2)', position: 'relative' }}>
                                                        {uploadProgress[q.id] > 0 && uploadProgress[q.id] < 100 && (
                                                            <div style={{
                                                                position: 'absolute', top: 0, left: 0, height: '100%',
                                                                width: `${uploadProgress[q.id]}%`,
                                                                background: 'rgba(var(--p3-rgb), 0.15)',
                                                                borderRadius: 'var(--radius-sm)',
                                                                transition: 'width 0.3s ease',
                                                                zIndex: 0
                                                            }} />
                                                        )}
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, position: 'relative', zIndex: 1 }}>
                                                            <Icon name={getFileIcon(fileInfo.mimeType)} size="1.8em" style={{ color: 'var(--p3)' }} />
                                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                                <p style={{ fontWeight: 600, fontSize: '0.9rem', marginBottom: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{fileInfo.name}</p>
                                                                <p style={{ fontSize: '0.78rem', color: 'var(--txt3)' }}>
                                                                    {formatFileSize(fileInfo.size)}
                                                                </p>
                                                            </div>
                                                            <div style={{ display: 'flex', gap: 6 }}>
                                                                {isImageFile(fileInfo.mimeType) && (
                                                                    <button className="btn-icon" onClick={() => window.open(getPreviewUrl(fileInfo.id), '_blank')} title="ดูตัวอย่าง">
                                                                        <Icon name="eye" />
                                                                    </button>
                                                                )}
                                                                <button className="btn-icon" onClick={() => downloadFileFromGAS(fileInfo.id, fileInfo.name)} title="ดาวน์โหลด">
                                                                    <Icon name="download" />
                                                                </button>
                                                                <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} onClick={() => {
                                                                    setAnswers(a => ({ ...a, [q.id]: '' }));
                                                                }} title="ลบ">
                                                                    <Icon name="xmark" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : null;
                                            })()
                                        ) : (
                                            <div
                                                className="custom-radio"
                                                style={{
                                                    borderStyle: 'dashed',
                                                    justifyContent: 'center',
                                                    padding: '28px',
                                                    cursor: uploading[q.id] ? 'wait' : 'pointer',
                                                    background: uploading[q.id] ? 'var(--bg3)' : undefined,
                                                    opacity: uploading[q.id] ? 0.7 : 1,
                                                    textAlign: 'center'
                                                }}
                                                onClick={() => !uploading[q.id] && document.getElementById(`file-input-${q.id}`).click()}
                                            >
                                                {uploading[q.id] ? (
                                                    <>
                                                        <Icon name="spinner" size="2.4em" style={{ color: 'var(--p3)', marginBottom: 8 }} />
                                                        <p style={{ fontWeight: 600, color: 'var(--p3)' }}>กำลังอัปโหลด...</p>
                                                        {uploadProgress[q.id] > 0 && (
                                                            <div style={{
                                                                width: '100%', height: 4, background: 'var(--border)',
                                                                borderRadius: 2, marginTop: 8, overflow: 'hidden'
                                                            }}>
                                                                <div style={{
                                                                    width: `${uploadProgress[q.id]}%`, height: '100%',
                                                                    background: 'linear-gradient(90deg, var(--p1), var(--p3))',
                                                                    transition: 'width 0.3s ease'
                                                                }} />
                                                            </div>
                                                        )}
                                                    </>
                                                ) : (
                                                    <>
                                                        <Icon name="cloud-upload-alt" size="2.4em" style={{ color: 'var(--p3)', marginBottom: 8 }} />
                                                        <p style={{ fontWeight: 600, color: 'var(--txt2)' }}>
                                                            {q.placeholder || 'คลิกเพื่ออัปโหลดไฟล์'}
                                                        </p>
                                                        <p style={{ fontSize: '0.78rem', color: 'var(--txt3)', marginTop: 4 }}>
                                                            รองรับไฟล์: {q.fileTypes || ALLOWED_EXTENSIONS} (สูงสุด {formatFileSize(q.maxFileSize || MAX_FILE_SIZE)})
                                                        </p>
                                                    </>
                                                )}
                                                <input
                                                    id={`file-input-${q.id}`}
                                                    type="file"
                                                    style={{ display: 'none' }}
                                                    accept={q.fileTypes || ALLOWED_EXTENSIONS}
                                                    onChange={(e) => {
                                                        if (e.target.files[0]) {
                                                            uploadFile(q.id, e.target.files[0]);
                                                        }
                                                    }}
                                                />
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ))}

                        <div className="divider" />
                        <button className="btn btn-primary ripple"
                            style={{ width: '100%', justifyContent: 'center', padding: '14px', fontSize: '0.96rem' }}
                            onClick={e => { addRipple(e); handleSubmit(); }}>
                            <Icon name="paper-plane" /> ส่งคำตอบ 🌸
                        </button>
                        <p style={{ textAlign: 'center', color: 'var(--txt3)', fontSize: '0.76rem', marginTop: 12 }}>
                            สร้างด้วย <strong style={{ color: 'var(--p3)' }}>FormFlow</strong>
                        </p>
                    </div>
                </div>
            );
        }

        function BottomNav({ page, setPage }) {
            const items = [
                { id: 'dashboard', icon: 'house-chimney', label: 'หน้าแรก' },
                { id: 'forms', icon: 'file-heart', label: 'ฟอร์ม' },
                { id: 'responses', icon: 'inbox', label: 'คำตอบ' },
                { id: 'files', icon: 'folder-open', label: 'ไฟล์' },
                { id: 'settings', icon: 'sliders', label: 'ตั้งค่า' },
            ];
            return (
                <nav className="bottom-nav">
                    <div className="bottom-nav-items">
                        {items.map(item => (
                            <div key={item.id} className={`bottom-nav-item ${page === item.id ? 'active' : ''}`} onClick={() => setPage(item.id)}>
                                <div className="nav-icon-wrap"><Icon name={item.icon} /></div>
                                <span>{item.label}</span>
                            </div>
                        ))}
                    </div>
                </nav>
            );
        }

        // =====================
        // MAIN APP
        // =====================
        function App() {
            const [loggedIn, setLoggedIn] = useState(() => sessionStorage.getItem('ff_auth') === '1');
            const [page, setPage] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [theme, setTheme] = useState('sakura');
            const [accent, setAccent] = useState('');
            const [toast, setToast] = useState(null);
            const [urlModal, setUrlModal] = useState(null);
            const [showScroll, setShowScroll] = useState(false);
            const { forms, responses, addForm, updateForm, deleteForm, addResponse, gasLoading, gasError } = useStore();

            const params = new URLSearchParams(location.search);
            const publicFormId = params.get('form');

            const handleThemeChange = useCallback(async (newTheme) => {
                setTheme(newTheme);
                applyTheme(newTheme);
                try {
                    const existing = await gasGet({ action: 'getAll' });
                    const settings = existing.settings || {};
                    settings.theme = newTheme;
                    await gasPost({ action: 'saveSettings', settings });
                } catch (e) {
                    console.error('ไม่สามารถบันทึกธีมลง Google Sheets ได้:', e);
                }
            }, []);

            useEffect(() => {
                gasGet({ action: 'getAll' }).then(data => {
                    if (data.settings?.theme) {
                        setTheme(data.settings.theme);
                        applyTheme(data.settings.theme);
                    }
                    if (data.settings?.adminpw) {
                        sessionStorage.setItem('ff_adminpw_cache', data.settings.adminpw);
                    }
                }).catch(() => { });
            }, []);

            useEffect(() => { applyTheme(theme); }, [theme]);

            useEffect(() => {
                const h = () => setShowScroll(scrollY > 300);
                addEventListener('scroll', h); return () => removeEventListener('scroll', h);
            }, []);

            const handleLogin = () => {
                sessionStorage.setItem('ff_auth', '1');
                setLoggedIn(true);
                showSuccessAlert('เข้าสู่ระบบสำเร็จ!', 'ยินดีต้อนรับสู่ FormFlow นะคะ~ 🌸');
            };
            const handleLogout = () => {
                sessionStorage.removeItem('ff_auth');
                setLoggedIn(false);
            };

            const pageTitles = {
                dashboard: <><Icon name="house-chimney" /> แดชบอร์ด</>,
                forms: <><Icon name="file-heart" /> ฟอร์มทั้งหมด</>,
                responses: <><Icon name="inbox" /> คำตอบ</>,
                analytics: <><Icon name="chart-pie" /> วิเคราะห์</>,
                files: <><Icon name="folder-open" /> ไฟล์ทั้งหมด</>,
                settings: <><Icon name="sliders" /> ตั้งค่า</>
            };

            if (publicFormId) {
                const form = forms.find(f => f.id === publicFormId);
                return <PublicForm form={form} onSubmit={(id, d) => { addResponse(id, d); }} />;
            }
            if (!loggedIn) return <LoginScreen onLogin={handleLogin} />;

            return (
                <>
                    <ScrollProgress />
                    <FloatingDecorations />
                    {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

                    {gasLoading && (
                        <div className="loading-overlay" id="loadingOverlay">
                            <div className="spinner"></div>
                            <span style={{
                                color: 'var(--txt3)', fontSize: '0.75rem', letterSpacing: '0.1em',
                                marginTop: '12px', fontFamily: 'var(--font-display)'
                            }}>LOADING</span>
                        </div>
                    )}

                    {gasError && (
                        <div style={{
                            position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999,
                            background: '#FF6070', color: '#fff', textAlign: 'center',
                            padding: '6px 12px', fontSize: '0.82rem'
                        }}>
                            ⚠️ เชื่อมต่อ Google Sheets ไม่ได้: {gasError}
                        </div>
                    )}

                    {urlModal && <UrlModal form={urlModal} onClose={() => setUrlModal(null)} />}
                    <Sidebar page={page} setPage={setPage} open={sidebarOpen} onClose={() => setSidebarOpen(false)} onLogout={handleLogout} />
                    <main className="main-content">
                        <TopBar
                            title={pageTitles[page] || 'FormFlow'}
                            onMenuClick={() => setSidebarOpen(!sidebarOpen)}
                            theme={theme}
                            onThemeChange={handleThemeChange}
                            accent={accent}
                            onAccentChange={setAccent}
                            onLogout={handleLogout}
                        />
                        {page === 'dashboard' && <DashboardPage forms={forms} responses={responses} />}
                        {page === 'forms' && (
                            <FormsPage forms={forms} responses={responses}
                                onAdd={f => { addForm(f); }}
                                onEdit={(id, f) => { updateForm(id, f); }}
                                onDelete={id => { deleteForm(id); }}
                                onToggle={(id, v) => { updateForm(id, { active: v }); }}
                                onViewUrl={f => setUrlModal(f)}
                            />
                        )}
                        {page === 'responses' && <ResponsesPage forms={forms} responses={responses} />}
                        {page === 'analytics' && <AnalyticsPage forms={forms} responses={responses} />}
                        {page === 'files' && <FilesPage forms={forms} />}
                        {page === 'settings' && <SettingsPage theme={theme} onThemeChange={handleThemeChange} onLogout={handleLogout} />}
                    </main>
                    <BottomNav page={page} setPage={setPage} />
                    <div className={`scroll-top-btn ${showScroll ? 'visible' : ''}`} onClick={() => scrollTo({ top: 0, behavior: 'smooth' })}>
                        <Icon name="arrow-up" />
                    </div>
                    <style>{`
                        @media(max-width:768px){#menu-btn{display:flex!important;}}
                        .stagger>*{animation:pageEnter 0.38s cubic-bezier(0.4,0,0.2,1) both;}
                        .empty-state{text-align:center;padding:60px;color:var(--txt3);}
                        .empty-state-emoji{font-size:3.5rem;margin-bottom:14px;}
                        .empty-state-title{font-weight:700;font-size:1rem;color:var(--txt2);margin-bottom:6px;}
                        .empty-state-sub{font-size:0.85rem;}
                        .theme-preview-bar{height:5px;border-radius:4px;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));margin-bottom:12px;}
                    `}</style>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
