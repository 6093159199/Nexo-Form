<!DOCTYPE html>
<html lang="th" data-theme="sakura">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 FormFlow — Cute Form Builder (Sheet-based)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Mali:wght@400;600;700&family=Mitr:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1">
    </script>

    <style>
        /* ============================================
           PASTEL THEME SYSTEM
        ============================================ */

        /* 🌸 SAKURA (Pink) */
        [data-theme="sakura"] {
            --p1: #F8B4C8;
            --p2: #F4A1B8;
            --p3: #E879A0;
            --bg: #FFF5F8;
            --bg2: #FEE8F0;
            --bg3: #FDDEE8;
            --card: #FFFFFF;
            --glass: rgba(255, 245, 248, 0.88);
            --txt: #5C2D3C;
            --txt2: #8B5A6A;
            --txt3: #B8899A;
            --border: #F5C8D8;
            --border2: #FAE0EA;
            --shadow: rgba(232, 121, 160, 0.12);
            --sbg: linear-gradient(160deg, #FFF0F5 0%, #FFE4EE 50%, #FFF5F8 100%);
            --badge-on-bg: rgba(232, 121, 160, 0.12);
            --badge-on-c: #C0527A;
            --badge-off-bg: rgba(139, 90, 106, 0.08);
            --badge-off-c: #8B5A6A;
        }

        /* 🍬 CANDY (Lavender) */
        [data-theme="candy"] {
            --p1: #C4B5F4;
            --p2: #B8A7F0;
            --p3: #8B6FE8;
            --bg: #F8F5FF;
            --bg2: #EEE8FF;
            --bg3: #E4DAFF;
            --card: #FFFFFF;
            --glass: rgba(248, 245, 255, 0.88);
            --txt: #3D2B6B;
            --txt2: #6B4F9A;
            --txt3: #9B82C8;
            --border: #D8CCFF;
            --border2: #EAE4FF;
            --shadow: rgba(139, 111, 232, 0.12);
            --sbg: linear-gradient(160deg, #F5F0FF 0%, #EDE4FF 50%, #F8F5FF 100%);
            --badge-on-bg: rgba(139, 111, 232, 0.12);
            --badge-on-c: #6B4FCB;
            --badge-off-bg: rgba(107, 79, 154, 0.08);
            --badge-off-c: #6B4F9A;
        }

        /* 🍑 PEACH (Orange) */
        [data-theme="peach"] {
            --p1: #FFB085;
            --p2: #FFA070;
            --p3: #FF7040;
            --bg: #FFF8F4;
            --bg2: #FFEEE4;
            --bg3: #FFE2D0;
            --card: #FFFFFF;
            --glass: rgba(255, 248, 244, 0.88);
            --txt: #5C2810;
            --txt2: #8B5030;
            --txt3: #B88060;
            --border: #FFD0B0;
            --border2: #FFE4CC;
            --shadow: rgba(255, 112, 64, 0.12);
            --sbg: linear-gradient(160deg, #FFF5EE 0%, #FFE8D8 50%, #FFF8F4 100%);
            --badge-on-bg: rgba(255, 112, 64, 0.12);
            --badge-on-c: #C04820;
            --badge-off-bg: rgba(139, 80, 48, 0.08);
            --badge-off-c: #8B5030;
        }

        /* 🌿 MINT (Green) */
        [data-theme="mint"] {
            --p1: #90E0C8;
            --p2: #7AD4B8;
            --p3: #2BAF88;
            --bg: #F2FFFE;
            --bg2: #E0FBF4;
            --bg3: #CCF7EC;
            --card: #FFFFFF;
            --glass: rgba(242, 255, 254, 0.88);
            --txt: #1A4438;
            --txt2: #3A7060;
            --txt3: #70A890;
            --border: #AAEEDD;
            --border2: #C8F5E8;
            --shadow: rgba(43, 175, 136, 0.12);
            --sbg: linear-gradient(160deg, #EEFFF9 0%, #D8FBF0 50%, #F2FFFE 100%);
            --badge-on-bg: rgba(43, 175, 136, 0.12);
            --badge-on-c: #1A8868;
            --badge-off-bg: rgba(58, 112, 96, 0.08);
            --badge-off-c: #3A7060;
        }

        /* 🌊 SKY (Blue) */
        [data-theme="sky"] {
            --p1: #90C8F0;
            --p2: #78B8EC;
            --p3: #3090D8;
            --bg: #F4FAFF;
            --bg2: #E4F2FF;
            --bg3: #D0E8FF;
            --card: #FFFFFF;
            --glass: rgba(244, 250, 255, 0.88);
            --txt: #1A3050;
            --txt2: #3A5878;
            --txt3: #7098B8;
            --border: #B0D8F4;
            --border2: #CCEAFF;
            --shadow: rgba(48, 144, 216, 0.12);
            --sbg: linear-gradient(160deg, #F0F8FF 0%, #DCF0FF 50%, #F4FAFF 100%);
            --badge-on-bg: rgba(48, 144, 216, 0.12);
            --badge-on-c: #1870B8;
            --badge-off-bg: rgba(58, 88, 120, 0.08);
            --badge-off-c: #3A5878;
        }

        /* 🍋 LEMON (Yellow) */
        [data-theme="lemon"] {
            --p1: #FFE070;
            --p2: #FFD840;
            --p3: #F0C000;
            --bg: #FFFDF0;
            --bg2: #FFFAE0;
            --bg3: #FFF5C0;
            --card: #FFFFFF;
            --glass: rgba(255, 253, 240, 0.88);
            --txt: #4A3C00;
            --txt2: #786020;
            --txt3: #A89040;
            --border: #FFE890;
            --border2: #FFF2C0;
            --shadow: rgba(240, 192, 0, 0.12);
            --sbg: linear-gradient(160deg, #FFFBEE 0%, #FFF5CC 50%, #FFFDF0 100%);
            --badge-on-bg: rgba(240, 192, 0, 0.15);
            --badge-on-c: #B07800;
            --badge-off-bg: rgba(120, 96, 32, 0.08);
            --badge-off-c: #786020;
        }

        /* 🌙 DARK MODE (Midnight) */
        [data-theme="dark"] {
            --p1: #C4A8E8;
            --p2: #B094DC;
            --p3: #9070C8;
            --bg: #1A1625;
            --bg2: #231E32;
            --bg3: #2D2840;
            --card: #271F38;
            --glass: rgba(35, 30, 50, 0.92);
            --txt: #F0E8FF;
            --txt2: #C8B8E8;
            --txt3: #9080B8;
            --border: #4A3870;
            --border2: #3A2E58;
            --shadow: rgba(0, 0, 0, 0.4);
            --sbg: linear-gradient(160deg, #1E1830 0%, #251E38 50%, #1A1625 100%);
            --badge-on-bg: rgba(196, 168, 232, 0.15);
            --badge-on-c: #C4A8E8;
            --badge-off-bg: rgba(144, 112, 200, 0.1);
            --badge-off-c: #9080B8;
        }

        /* ============================================
           GLOBAL BASE
        ============================================ */
        :root {
            --sidebar-w: 260px;
            --radius-sm: 14px;
            --radius: 20px;
            --radius-lg: 26px;
            --radius-xl: 34px;
            --font-display: 'Mali', 'Mitr', 'Noto Sans Thai', cursive;
            --font-body: 'Noto Sans Thai', 'Mitr', sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --trans: all 0.22s var(--ease);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s var(--ease), color 0.35s var(--ease);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--sbg);
            z-index: -2;
            transition: background 0.4s var(--ease);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 15% 20%, var(--p1) 0%, transparent 35%),
                radial-gradient(circle at 85% 10%, var(--p2) 0%, transparent 30%),
                radial-gradient(circle at 70% 80%, var(--p1) 0%, transparent 28%),
                radial-gradient(circle at 10% 75%, var(--p2) 0%, transparent 25%);
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
            animation: blobShift 18s ease-in-out infinite alternate;
        }

        @keyframes blobShift {
            0% {
                transform: scale(1) translateX(0) translateY(0);
            }

            33% {
                transform: scale(1.05) translateX(-2%) translateY(1%);
            }

            66% {
                transform: scale(0.98) translateX(1%) translateY(-1%);
            }

            100% {
                transform: scale(1.02) translateX(-1%) translateY(2%);
            }
        }

        .dot-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            opacity: 0.5;
            pointer-events: none;
        }

        /* ============================================
           SCROLLBAR
        ============================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--p1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--p3);
        }

        /* ============================================
           TYPOGRAPHY
        ============================================ */
        .font-display {
            font-family: var(--font-display);
        }

        .text-primary {
            color: var(--p3);
        }

        /* ============================================
           BUTTONS
        ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--trans);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            box-shadow: 0 4px 16px var(--shadow), 0 0 0 0 var(--p1);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px var(--shadow), 0 0 20px var(--p1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-ghost {
            background: var(--bg2);
            color: var(--txt2);
            border: 2px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg3);
            border-color: var(--p1);
            color: var(--p3);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #FFAAB0, #FF6070);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 96, 112, 0.25);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 96, 112, 0.35);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg2);
            border: 2px solid var(--border);
            color: var(--txt2);
            cursor: pointer;
            transition: var(--trans);
            font-size: 0.9rem;
        }

        .btn-icon:hover {
            background: var(--bg3);
            border-color: var(--p1);
            color: var(--p3);
            transform: scale(1.1) rotate(8deg);
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-anim 0.55s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ============================================
           CARDS
        ============================================ */
        .card {
            background: var(--card);
            border: 1.5px solid var(--border2);
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 12px var(--shadow);
            transition: var(--trans);
        }

        .card:hover {
            box-shadow: 0 6px 24px var(--shadow);
            transform: translateY(-2px);
            border-color: var(--border);
        }

        .card-glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 20px var(--shadow);
        }

        /* ============================================
           FORMS
        ============================================ */
        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .form-field label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--txt2);
            letter-spacing: 0.01em;
        }

        .form-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--txt);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--trans);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--p1);
            background: var(--card);
            box-shadow: 0 0 0 4px var(--bg3), 0 4px 12px var(--shadow);
        }

        .form-input::placeholder {
            color: var(--txt3);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
            border-radius: var(--radius-sm);
        }

        select.form-input {
            cursor: pointer;
        }

        /* ============================================
           LAYOUT
        ============================================ */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-w);
            z-index: 200;
            display: flex;
            flex-direction: column;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 2px solid var(--border);
            box-shadow: 4px 0 24px var(--shadow);
            transition: transform 0.35s var(--ease);
            padding: 20px 14px;
            gap: 2px;
        }

        .sidebar-logo {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--p3);
            padding: 12px 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        .sidebar-logo-icon {
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 1.2rem;
            box-shadow: 0 4px 14px var(--shadow);
            animation: logo-pulse 3s ease-in-out infinite;
        }

        @keyframes logo-pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 4px 14px var(--shadow);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 6px 20px var(--shadow);
            }
        }

        .sidebar-section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--txt3);
            padding: 10px 16px 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--txt2);
            transition: var(--trans);
            font-family: var(--font-display);
        }

        .nav-item:hover {
            background: var(--bg2);
            color: var(--txt);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .nav-item .nav-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.3);
            transition: var(--trans);
        }

        .nav-item.active .nav-icon {
            background: rgba(255, 255, 255, 0.25);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 16px;
            border-top: 2px dashed var(--border);
            font-size: 0.72rem;
            color: var(--txt3);
            text-align: center;
            font-family: var(--font-display);
        }

        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            padding: 28px 32px;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           TOPBAR
        ============================================ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 14px 22px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: 0 2px 16px var(--shadow);
        }

        .page-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.45rem;
            color: var(--p3);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============================================
           THEME PICKER
        ============================================ */
        .theme-picker-panel {
            position: absolute;
            right: 0;
            top: 52px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            min-width: 300px;
            box-shadow: 0 12px 40px var(--shadow);
            z-index: 600;
            animation: slideDown 0.2s var(--ease);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .theme-swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--trans);
            font-size: 0.72rem;
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--txt2);
        }

        .theme-swatch:hover {
            background: var(--bg2);
            border-color: var(--border);
            transform: scale(1.05);
        }

        .theme-swatch.active {
            border-color: var(--p3);
            background: var(--bg2);
        }

        .theme-swatch-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid white;
        }

        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1.5px dashed var(--border);
        }

        /* ============================================
           STAT CARDS
        ============================================ */
        .stat-card {
            padding: 22px;
            position: relative;
            overflow: hidden;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--p3);
        }

        .stat-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--txt2);
            margin-top: 6px;
            font-family: var(--font-display);
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--p1), var(--p2));
            color: white;
            margin-top: 8px;
            letter-spacing: 0.03em;
        }

        .stat-icon {
            position: absolute;
            right: -8px;
            bottom: -8px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            opacity: 0.15;
        }

        /* ============================================
           BADGES & CHIPS
        ============================================ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: 0.02em;
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge-on {
            background: var(--badge-on-bg);
            color: var(--badge-on-c);
        }

        .badge-off {
            background: var(--badge-off-bg);
            color: var(--badge-off-c);
            opacity: 0.8;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--bg3);
            color: var(--txt2);
            border: 1.5px solid var(--border);
            font-family: var(--font-display);
        }

        /* ============================================
           TOGGLE
        ============================================ */
        .toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 28px;
            cursor: pointer;
            transition: var(--trans);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 4px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: var(--trans);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .toggle input:checked+.toggle-slider {
            background: linear-gradient(135deg, var(--p1), var(--p3));
        }

        .toggle input:checked+.toggle-slider::before {
            transform: translateX(22px);
        }

        /* ============================================
           BOTTOM NAV
        ============================================ */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 300;
            padding: 8px 12px 12px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            border-top: 1.5px solid var(--border);
            box-shadow: 0 -4px 20px var(--shadow);
        }

        .bottom-nav-items {
            display: flex;
            width: 100%;
        }

        .bottom-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 6px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            color: var(--txt3);
            transition: var(--trans);
            font-size: 0.65rem;
            font-weight: 700;
            font-family: var(--font-display);
        }

        .bottom-nav-item .nav-icon-wrap {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--trans);
        }

        .bottom-nav-item.active {
            color: var(--p3);
        }

        .bottom-nav-item.active .nav-icon-wrap {
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-4px) scale(1.1);
        }

        /* ============================================
           LOGIN
        ============================================ */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 44px 40px;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px var(--shadow), 0 0 0 1px var(--border);
            animation: float-card 5s ease-in-out infinite;
        }

        @keyframes float-card {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-logo {
            font-family: var(--font-display);
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--p3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .login-input {
            width: 100%;
            padding: 14px 22px;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 50px;
            color: var(--txt);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: var(--trans);
        }

        .login-input:focus {
            border-color: var(--p1);
            background: var(--card);
            box-shadow: 0 0 0 4px var(--bg3);
        }

        /* ============================================
           MODALS
        ============================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.18s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-box {
            width: 100%;
            max-width: 620px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 32px;
            border-radius: var(--radius-xl);
            animation: slideUp 0.28s var(--ease);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--p3);
        }

        /* ============================================
           FORM CARDS (list)
        ============================================ */
        .form-card {
            padding: 0;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .form-card-inner {
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .form-card-icon {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            border: 2px solid var(--border);
        }

        .form-card-accent-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--p1), var(--p3));
        }

        /* ============================================
           QUESTION ITEMS
        ============================================ */
        .question-item {
            padding: 14px 18px;
            margin-bottom: 10px;
            cursor: grab;
            border-radius: var(--radius);
            border-left: 4px solid var(--p1);
            transition: var(--trans);
        }

        .question-item:hover {
            border-left-color: var(--p3);
        }

        .q-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--p1)30, var(--p2)30);
            color: var(--p3);
            border: 1px solid var(--p1);
        }

        /* ============================================
           PUBLIC FORM
        ============================================ */
        .public-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .public-card {
            width: 100%;
            max-width: 640px;
            border-radius: var(--radius-xl);
            padding: 36px;
            animation: slideUp 0.35s var(--ease);
        }

        .custom-radio,
        .custom-check {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--trans);
            border: 2px solid var(--border);
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .custom-radio:hover,
        .custom-check:hover {
            background: var(--bg2);
            border-color: var(--p1);
        }

        .custom-radio.selected,
        .custom-check.selected {
            background: var(--bg3);
            border-color: var(--p3);
        }

        .custom-radio input,
        .custom-check input {
            display: none;
        }

        .radio-dot {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            transition: var(--trans);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-radio.selected .radio-dot {
            border-color: var(--p3);
            background: var(--p3);
        }

        .custom-radio.selected .radio-dot::after {
            content: '';
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
        }

        .check-box {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border-radius: 6px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--trans);
        }

        .custom-check.selected .check-box {
            background: var(--p3);
            border-color: var(--p3);
        }

        .custom-check.selected .check-box::after {
            content: '✓';
            color: white;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .star-rating {
            display: flex;
            gap: 6px;
        }

        .star {
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .star:hover {
            transform: scale(1.35) rotate(12deg);
        }

        /* ============================================
           URL BOX
        ============================================ */
        .url-box {
            background: var(--bg2);
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--p3);
            word-break: break-all;
        }

        /* ============================================
           TOAST
        ============================================ */
        .toast-ff {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 9999;
            padding: 13px 22px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 0.88rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: toast-in 0.3s var(--ease);
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-display);
            backdrop-filter: blur(4px);
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* ============================================
           SCROLL PROGRESS + SCROLL TOP
        ============================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--p1), var(--p3), var(--p1));
            background-size: 200% 100%;
            animation: progress-shimmer 2s linear infinite;
            z-index: 9999;
            border-radius: 0 3px 3px 0;
        }

        @keyframes progress-shimmer {
            to {
                background-position: -200% 0;
            }
        }

        .scroll-top-btn {
            position: fixed;
            bottom: 88px;
            right: 28px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--p1), var(--p3));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--shadow);
            z-index: 999;
            transition: all 0.3s var(--ease);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.8);
            font-size: 1rem;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .scroll-top-btn:hover {
            transform: translateY(-4px) scale(1.12);
        }

        /* ============================================
           SIDEBAR OVERLAY
        ============================================ */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 199;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* ============================================
           DIVIDER
        ============================================ */
        .divider {
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 22px 0;
        }

        /* ============================================
           ANIMATIONS
        ============================================ */
        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .stagger>* {
            animation: pageEnter 0.38s var(--ease) both;
        }

        .stagger>*:nth-child(2) {
            animation-delay: 0.06s;
        }

        .stagger>*:nth-child(3) {
            animation-delay: 0.12s;
        }

        .stagger>*:nth-child(4) {
            animation-delay: 0.18s;
        }

        .stagger>*:nth-child(5) {
            animation-delay: 0.22s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .bounce-in {
            animation: bounceIn 0.45s var(--ease);
        }

        .floating-decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) rotate(720deg) scale(1.3);
                opacity: 0;
            }
        }

        /* ============================================
           CHART
        ============================================ */
        .chart-wrap {
            position: relative;
            height: 240px;
        }

        /* ============================================
           SWAL OVERRIDES
        ============================================ */
        .swal2-popup {
            font-family: var(--font-display), sans-serif !important;
            border-radius: var(--radius-xl) !important;
            background: var(--card) !important;
            color: var(--txt) !important;
            border: 2px solid var(--border) !important;
        }

        .swal2-confirm {
            border-radius: 50px !important;
            background: linear-gradient(135deg, var(--p1), var(--p3)) !important;
            font-family: var(--font-display) !important;
            box-shadow: 0 4px 14px var(--shadow) !important;
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 16px 16px 100px;
            }

            .bottom-nav {
                display: flex;
            }

            .chart-grid {
                grid-template-columns: 1fr !important;
            }
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: 2px solid var(--border);
            background: var(--bg2);
            width: 42px;
            height: 38px;
            cursor: pointer;
            padding: 2px;
            border-radius: 12px;
            overflow: hidden;
        }

        .svg-icon {
            display: inline-block;
            vertical-align: middle;
            width: 1em;
            height: 1em;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .svg-icon-fill {
            fill: currentColor;
            stroke: none;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner-svg {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

        function useRipple() {
            return useCallback((e) => {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const span = document.createElement('span');
                span.className = 'ripple-effect';
                span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px`;
                btn.appendChild(span);
                setTimeout(() => span.remove(), 600);
            }, []);
        }

        /* ============================================
           STORE - ใช้ Google Sheets API เท่านั้น
        ============================================ */
        function useStore() {
            const [forms, setForms] = useState([]);
            const [responses, setResponses] = useState({});
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // โหลดข้อมูลทั้งหมดเมื่อเริ่มต้น
            useEffect(() => {
                loadAllData();
            }, []);

            const callGAS = async (action, data = null, method = 'POST') => {
                try {
                    let url = GAS_URL;
                    let options = {};

                    if (method === 'GET') {
                        url += '?action=' + action;
                        if (data) {
                            Object.keys(data).forEach(key => {
                                url += '&' + key + '=' + encodeURIComponent(data[key]);
                            });
                        }
                        options = { method: 'GET' };
                    } else {
                        options = {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action, ...data })
                        };
                    }

                    const response = await fetch(url, options);
                    return await response.json();
                } catch (err) {
                    console.error('❌ GAS API Error:', err);
                    return { success: false, message: err.message };
                }
            };

            const loadAllData = async () => {
                try {
                    setLoading(true);

                    // ดึงฟอร์มทั้งหมด
                    const formsResult = await callGAS('getAllForms', null, 'POST');

                    if (formsResult.success) {
                        const loadedForms = formsResult.data || [];
                        setForms(loadedForms);

                        // ดึงคำตอบทั้งหมดสำหรับแต่ละฟอร์ม
                        const allResponses = {};
                        for (const form of loadedForms) {
                            const respResult = await callGAS('getResponses', { formId: form.id }, 'POST');
                            if (respResult.success && respResult.data.length > 0) {
                                allResponses[form.id] = respResult.data;
                            }
                        }
                        setResponses(allResponses);
                    } else {
                        setError(formsResult.message);
                    }
                } catch (err) {
                    console.error('❌ Error loading data:', err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const addForm = async (formData) => {
                const newForm = {
                    ...formData,
                    id: generateId(),
                    createdAt: new Date().toISOString(),
                    active: true,
                    responseCount: 0
                };

                const result = await callGAS('saveFormToSheet', {
                    data: { ...newForm, action: 'create' }
                });

                if (result.success) {
                    setForms(prev => [...prev, newForm]);
                    return newForm;
                } else {
                    throw new Error(result.message);
                }
            };

            const updateForm = async (id, updates) => {
                const existingForm = forms.find(f => f.id === id);
                if (!existingForm) throw new Error('ไม่พบฟอร์ม');

                const newFormData = { ...existingForm, ...updates, updatedAt: new Date().toISOString() };

                const result = await callGAS('saveFormToSheet', {
                    data: { ...newFormData, action: 'update' }
                });

                if (result.success) {
                    setForms(prev => prev.map(f => f.id === id ? newFormData : f));
                } else {
                    throw new Error(result.message);
                }
            };

            const deleteForm = async (id) => {
                const result = await callGAS('deleteFormData', { data: { formId: id } });

                if (result.success) {
                    setForms(prev => prev.filter(f => f.id !== id));
                    setResponses(prev => {
                        const newResp = { ...prev };
                        delete newResp[id];
                        return newResp;
                    });
                } else {
                    throw new Error(result.message);
                }
            };

            const toggleFormActive = async (id, active) => {
                const result = await callGAS('updateFormActive', { data: { formId: id, active } });

                if (result.success) {
                    setForms(prev => prev.map(f => f.id === id ? { ...f, active } : f));
                }
            };

            const addResponse = async (formId, data, fileUrls = {}) => {
                const form = forms.find(f => f.id === formId);
                if (!form) throw new Error('ไม่พบฟอร์ม');

                const responseId = generateId();
                const submittedAt = new Date().toISOString();

                const result = await callGAS('saveResponse', {
                    data: {
                        responseId,
                        formId,
                        formTitle: form.title,
                        submittedAt,
                        questions: form.questions || [],
                        answers: data,
                        fileUrls: fileUrls || {}
                    }
                });

                if (result.success) {
                    setResponses(prev => ({
                        ...prev,
                        [formId]: [...(prev[formId] || []), {
                            id: responseId,
                            submittedAt,
                            data,
                            fileUrls
                        }]
                    }));

                    setForms(prev => prev.map(f =>
                        f.id === formId ? { ...f, responseCount: (f.responseCount || 0) + 1 } : f
                    ));
                }

                return result;
            };

            const deleteResponse = async (formId, responseId) => {
                const result = await callGAS('deleteResponseById', {
                    data: { formId, responseId }
                });

                if (result.success) {
                    setResponses(prev => ({
                        ...prev,
                        [formId]: (prev[formId] || []).filter(r => r.id !== responseId)
                    }));
                    await loadAllData(); // รีโหลดเพื่ออัปเดต response count
                }

                return result;
            };

            const updateSettings = async (settings) => {
                return await callGAS('saveSettings', { data: settings });
            };

            const verifyPassword = async (password) => {
                return await callGAS('verifyPassword', { password }, 'GET');
            };

            return {
                forms,
                responses,
                loading,
                error,
                addForm,
                updateForm,
                deleteForm,
                toggleFormActive,
                addResponse,
                deleteResponse,
                updateSettings,
                verifyPassword,
                loadAllData
            };
        }

        /* ——— COMPONENTS ——— */

        function Toast({ msg, type = 'success', onDone }) {
            useEffect(() => { const t = setTimeout(onDone, 3200); return () => clearTimeout(t); }, []);
            const bg = type === 'success' ? 'linear-gradient(135deg,#90D4B0,#2BAF80)'
                : type === 'error' ? 'linear-gradient(135deg,#FFAAB0,#FF6070)'
                    : 'linear-gradient(135deg,var(--p1),var(--p3))';
            const icon = type === 'success' ? 'circle-check' : type === 'error' ? 'circle-xmark' : 'circle-info';
            return <div className="toast-ff" style={{ background: bg }}><Icon name={icon} /> {msg}</div>;
        }

        function ScrollProgress() {
            const [w, setW] = useState(0);
            useEffect(() => {
                const h = () => { const d = document.documentElement; setW(d.scrollHeight - innerHeight > 0 ? scrollY / (d.scrollHeight - innerHeight) * 100 : 0); };
                addEventListener('scroll', h);
                return () => removeEventListener('scroll', h);
            }, []);
            return <div className="scroll-progress" style={{ width: `${w}%` }} />;
        }

        function LoginScreen({ onLogin, verifyPassword }) {
            const [pw, setPw] = useState('');
            const [err, setErr] = useState('');
            const [loading, setLoading] = useState(false);
            const addRipple = useRipple();

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    const result = await verifyPassword(pw);

                    if (result.success) {
                        confetti({
                            particleCount: 120,
                            spread: 70,
                            origin: { y: 0.6 },
                            colors: ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#FFE070']
                        });
                        onLogin();
                    } else {
                        setErr('💔 รหัสผ่านไม่ถูกต้อง ลองใหม่นะคะ~');
                        showErrorAlert('เข้าสู่ระบบไม่สำเร็จ', 'รหัสผ่านไม่ถูกต้องนะคะ ลองใหม่อีกครั้ง~');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    setErr('💔 ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                    showErrorAlert('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="login-wrap">
                    <FloatingDecorations />
                    <div className="login-card bounce-in">
                        <div style={{ fontSize: '3rem', marginBottom: 4 }}>🌸</div>
                        <div className="login-logo">FormFlow</div>
                        <p style={{ color: 'var(--txt2)', marginBottom: 30, fontSize: '0.92rem', fontFamily: 'var(--font-display)' }}>

                            <div style={{ marginBottom: 16 }}>

                            </div>

                                    <Icon name="circle-exclamation" /> {err}

                            </button>
                        </form>
                        <p style={{ color: 'var(--txt3)', fontSize: '0.75rem', marginTop: 22 }}>
                            <Icon name="cloud" style={{ marginRight: 5 }} />
                            ข้อมูลทั้งหมดบันทึกใน Google Sheets

                    </div>
                </div>
            );

                <div className="topbar">
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <button className="btn-icon" onClick={onMenuClick} style={{ display: 'none' }} id="menu-btn">
                            <Icon name="bars" />
                        </button>
                        <span className="page-title">{title}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, position: 'relative' }}>
                        <button className="btn-icon" onClick={() => setShowTheme(!showTheme)} title="เปลี่ยนธีม">
                            <Icon name="chart-pie" />
                        </button>
                        <button className="btn-icon" onClick={handleLogout} title="ออกจากระบบ">
                            <Icon name="arrow-right-from-bracket" />
                        </button>
                        {showTheme && (
                            <div className="theme-picker-panel">
                                <ThemePicker currentTheme={theme} onThemeChange={t => { onThemeChange(t); setShowTheme(false); }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function QuestionModal({ question, onSave, onClose }) {
            const isEdit = !!question?.id;
            const [data, setData] = useState({
                title: question?.title || '', type: question?.type || 'short',
                required: question?.required || false,
                options: question?.options || ['ตัวเลือกที่ 1'],
                placeholder: question?.placeholder || '',
            });
            const set = (k, v) => setData(d => ({ ...d, [k]: v }));
            const needsOpts = ['multiple', 'dropdown'].includes(data.type);
            const addRipple = useRipple();
            const handleSave = () => {
                if (!data.title.trim()) {
                    showWarningAlert('กรุณากรอกข้อมูล', '💬 ใส่ชื่อคำถามด้วยนะ~');
                    return;
                }
                onSave(data);
                onClose();
            };
            return (
                <div className="modal-overlay" style={{ zIndex: 1100 }} onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card">
                        <div className="modal-title">
                            <Icon name={isEdit ? 'pen-to-square' : 'plus'} />
                            {isEdit ? '✏️ แก้ไขคำถาม' : '✨ เพิ่มคำถามใหม่'}
                        </div>
                        <div className="form-field">
                            <label>💖 ชื่อคำถาม *</label>
                            <input className="form-input" placeholder="เช่น คุณชอบอะไรมากที่สุด?" value={data.title} onChange={e => set('title', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>📋 ประเภทคำถาม</label>
                            <select className="form-input" value={data.type} onChange={e => set('type', e.target.value)}>
                                {QUESTION_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                            </select>
                        </div>
                        <div className="form-field">
                            <label>💬 ข้อความแนะนำ</label>
                            <input className="form-input" placeholder="ข้อความแสดงในช่อง" value={data.placeholder} onChange={e => set('placeholder', e.target.value)} />
                        </div>
                        {needsOpts && (
                            <div className="form-field">
                                <label>🎯 ตัวเลือก</label>
                                {data.options.map((o, i) => (
                                    <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                                        <input className="form-input" value={o} onChange={e => set('options', data.options.map((x, j) => j === i ? e.target.value : x))} style={{ flex: 1 }} />
                                        {data.options.length > 1 && <button className="btn-icon" onClick={() => set('options', data.options.filter((_, j) => j !== i))}><Icon name="xmark" /></button>}
                                    </div>
                                ))}
                                <button className="btn btn-ghost" style={{ fontSize: '0.82rem', padding: '7px 14px' }} onClick={() => set('options', [...data.options, `ตัวเลือกที่ ${data.options.length + 1}`])}>
                                    <Icon name="plus" /> เพิ่มตัวเลือก
                                </button>
                            </div>
                        )}
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 0' }}>
                            <span style={{ fontWeight: 600, fontSize: '0.88rem', fontFamily: 'var(--font-display)', color: 'var(--txt2)' }}>🔴 คำถามบังคับ</span>
                            <label className="toggle"><input type="checkbox" checked={data.required} onChange={e => set('required', e.target.checked)} /><span className="toggle-slider" /></label>
                        </div>
                        <div className="divider" />
                        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button className="btn btn-ghost" onClick={onClose}><Icon name="xmark" /> ยกเลิก</button>
                            <button className="btn btn-primary ripple" onClick={e => { addRipple(e); handleSave(); }}><Icon name="check" /> บันทึก</button>
                        </div>
                    </div>
                </div>
            );
        }

        function FormModal({ form, onSave, onClose }) {
            const isEdit = !!form?.id;
            const [data, setData] = useState({
                title: form?.title || '', description: form?.description || '',
                accentColor: form?.accentColor || '#F8B4C8',
                bgColor: form?.bgColor || '#FFF5F8',
                headerImage: form?.headerImage || '',
                questions: form?.questions || [], active: form?.active !== undefined ? form.active : true,
            });
            const [qModal, setQModal] = useState(null);
            const [dragIdx, setDragIdx] = useState(null);
            const addRipple = useRipple();
            const set = (k, v) => setData(d => ({ ...d, [k]: v }));
            const addQ = q => { set('questions', [...data.questions, { id: generateId(), ...q }]); setQModal(null); };
            const updateQ = (id, q) => set('questions', data.questions.map(x => x.id === id ? { ...x, ...q } : x));
            const deleteQ = id => {
                const question = data.questions.find(q => q.id === id);
                showDeleteConfirm('ลบคำถาม?', `คุณแน่ใจหรือไม่ที่จะลบ "${question?.title || '(ไม่มีชื่อ)'}"? การกระทำนี้ไม่สามารถย้อนกลับได้`)
                    .then((result) => {
                        if (result.isConfirmed) {
                            set('questions', data.questions.filter(x => x.id !== id));
                            showSuccessAlert('ลบคำถามแล้ว', 'คำถามถูกลบเรียบร้อยแล้ว');
                        }
                    });
            };
            const handleSave = () => {
                if (!data.title.trim()) {
                    showWarningAlert('กรุณากรอกข้อมูล', '💬 ต้องมีชื่อฟอร์มนะ~');
                    return;
                }
                onSave(data);
            };
            const dragStart = idx => setDragIdx(idx);
            const dragOver = (e, idx) => {
                e.preventDefault(); if (dragIdx === null || dragIdx === idx) return;
                const qs = [...data.questions]; const [m] = qs.splice(dragIdx, 1); qs.splice(idx, 0, m);
                set('questions', qs); setDragIdx(idx);
            };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card">
                        <div className="modal-title">
                            <Icon name={isEdit ? 'pen-to-square' : 'file-circle-plus'} />
                            {isEdit ? '🍂 แก้ไขฟอร์ม' : '✨ สร้างฟอร์มใหม่'}
                        </div>
                        <div className="form-field">
                            <label>💖 ชื่อฟอร์ม *</label>
                            <input className="form-input" placeholder="เช่น แบบสำรวจขนมหวาน 🍰" value={data.title} onChange={e => set('title', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>📝 คำอธิบาย</label>
                            <textarea className="form-input" placeholder="อธิบายรายละเอียดฟอร์ม..." value={data.description} onChange={e => set('description', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>🖼️ รูปภาพส่วนหัว (URL หรืออีโมจิ)</label>
                            <input className="form-input" placeholder="https://... หรือ 🍰" value={data.headerImage} onChange={e => set('headerImage', e.target.value)} />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                            <div className="form-field">
                                <label>🎨 สีหลัก</label>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <input type="color" value={data.accentColor} onChange={e => set('accentColor', e.target.value)} />
                                    <span style={{ color: 'var(--txt3)', fontSize: '0.8rem', fontFamily: 'monospace' }}>{data.accentColor}</span>
                                </div>
                            </div>
                            <div className="form-field">
                                <label>🌈 สีพื้นหลัง</label>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <input type="color" value={data.bgColor} onChange={e => set('bgColor', e.target.value)} />
                                    <span style={{ color: 'var(--txt3)', fontSize: '0.8rem', fontFamily: 'monospace' }}>{data.bgColor}</span>
                                </div>
                            </div>
                        </div>
                        <div className="divider" />
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                            <span style={{ fontWeight: 600, fontSize: '0.88rem', fontFamily: 'var(--font-display)', color: 'var(--txt2)' }}>📬 เปิดรับคำตอบ</span>
                            <label className="toggle"><input type="checkbox" checked={data.active} onChange={e => set('active', e.target.checked)} /><span className="toggle-slider" /></label>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                            <span style={{ fontWeight: 700, fontSize: '0.92rem', color: 'var(--txt)' }}>❓ คำถาม ({data.questions.length})</span>
                            <button className="btn btn-primary ripple" style={{ padding: '7px 14px', fontSize: '0.8rem' }} onClick={e => { addRipple(e); setQModal({}); }}>
                                <Icon name="plus" /> เพิ่มคำถาม
                            </button>
                        </div>
                        {data.questions.length === 0 && (
                            <div style={{ textAlign: 'center', padding: '28px', color: 'var(--txt3)', border: '2px dashed var(--border)', borderRadius: 'var(--radius)' }}>
                                <Icon name="circle-question" style={{ fontSize: '2.2rem', marginBottom: 10, display: 'block', color: 'var(--p1)' }} />
                                <p style={{ fontWeight: 600, fontSize: '0.9rem' }}>ยังไม่มีคำถาม</p>
                                <p style={{ fontSize: '0.82rem', marginTop: 4 }}>คลิก "เพิ่มคำถาม" เพื่อเริ่มสร้าง</p>
                            </div>
                        )}
                        {data.questions.map((q, idx) => (
                            <div key={q.id} className="question-item card"
                                draggable onDragStart={() => dragStart(idx)} onDragOver={e => dragOver(e, idx)} onDragEnd={() => setDragIdx(null)}
                                style={{ ...(dragIdx === idx ? { opacity: 0.5, transform: 'scale(0.98)' } : {}) }}>
                                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                                    <Icon name="grip-vertical" style={{ color: 'var(--txt3)', marginTop: 4, cursor: 'grab' }} />
                                    <div style={{ flex: 1 }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                                            <span className="q-type-badge">
                                                <Icon name={QUESTION_TYPES.find(t => t.value === q.type)?.icon || 'circle-question'} />
                                                {QUESTION_TYPES.find(t => t.value === q.type)?.label || q.type}
                                            </span>
                                            {q.required && <span className="chip" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)', background: 'rgba(208,64,96,0.06)' }}>จำเป็น*</span>}
                                        </div>
                                        <p style={{ fontWeight: 600, fontSize: '0.9rem' }}>{q.title || '(ไม่มีชื่อ)'}</p>
                                        {q.options?.length > 0 && <p style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginTop: 2 }}>{q.options.length} ตัวเลือก</p>}
                                    </div>
                                    <div style={{ display: 'flex', gap: 5 }}>
                                        <button className="btn-icon" onClick={() => setQModal(q)}><Icon name="pen-to-square" /></button>
                                        <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} onClick={() => deleteQ(q.id)}><Icon name="trash-can" /></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                        <div className="divider" />
                        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button className="btn btn-ghost" onClick={onClose}><Icon name="xmark" /> ยกเลิก</button>
                            <button className="btn btn-primary ripple" onClick={e => { addRipple(e); handleSave(); }}><Icon name="floppy-disk" /> บันทึกฟอร์ม</button>
                        </div>
                    </div>
                    {qModal !== null && (
                        <QuestionModal question={qModal} onSave={q => qModal.id ? updateQ(qModal.id, q) : addQ(q)} onClose={() => setQModal(null)} />
                    )}
                </div>
            );
        }

        function DashboardPage({ forms, responses }) {
            const totalForms = forms.length;
            const activeForms = forms.filter(f => f.active).length;
            const totalResp = Object.values(responses).reduce((s, a) => s + a.length, 0);
            const thisMonth = Object.values(responses).flat().filter(r => new Date(r.submittedAt).getMonth() === new Date().getMonth()).length;
            const stats = [
                { label: 'ฟอร์มทั้งหมด', val: totalForms, icon: 'file-heart' },
                { label: 'เปิดใช้งาน', val: activeForms, icon: 'circle-check' },
                { label: 'คำตอบทั้งหมด', val: totalResp, icon: 'inbox' },
                { label: 'เดือนนี้', val: thisMonth, icon: 'calendar-days' },
            ];
            const chartRef = useRef(null), chartRef2 = useRef(null), c1 = useRef(null), c2 = useRef(null);
            useEffect(() => {
                if (!chartRef.current) return;
                c1.current?.destroy();
                const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                const counts = Array(12).fill(0);
                Object.values(responses).flat().forEach(r => counts[new Date(r.submittedAt).getMonth()]++);
                const style = getComputedStyle(document.documentElement);
                const p1 = style.getPropertyValue('--p1').trim() || '#F8B4C8';
                const p3 = style.getPropertyValue('--p3').trim() || '#E879A0';
                c1.current = new Chart(chartRef.current, {
                    type: 'bar',
                    data: {
                        labels: months, datasets: [{
                            label: 'คำตอบ', data: counts,
                            backgroundColor: `${p1}88`, borderColor: p3, borderWidth: 2, borderRadius: 10
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(128,128,128,0.08)' }, ticks: { color: 'var(--txt3)' } },
                            x: { grid: { display: false }, ticks: { color: 'var(--txt3)' } }
                        }
                    }
                });
                return () => c1.current?.destroy();
            }, [responses]);
            useEffect(() => {
                if (!chartRef2.current || forms.length === 0) return;
                c2.current?.destroy();
                const colors = ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#90C8F0', '#FFE070'];
                c2.current = new Chart(chartRef2.current, {
                    type: 'doughnut',
                    data: {
                        labels: forms.map(f => f.title.length > 14 ? f.title.slice(0, 14) + '…' : f.title),
                        datasets: [{
                            data: forms.map(f => (responses[f.id] || []).length || 1),
                            backgroundColor: colors.slice(0, forms.length), borderWidth: 3, borderColor: 'rgba(255,255,255,0.8)', hoverOffset: 14
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { color: 'var(--txt2)', padding: 14, font: { size: 11 }, usePointStyle: true, pointStyleWidth: 8 } } }
                    }
                });
                return () => c2.current?.destroy();
            }, [forms, responses]);

            return (
                <div className="stagger">
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 16, marginBottom: 24 }}>
                        {stats.map((s, i) => (
                            <div key={i} className="card stat-card">
                                <div style={{ fontSize: '1.6rem', marginBottom: 6 }}>
                                    <Icon name={s.icon} size="1.6em" />
                                </div>
                                <div className="stat-number">{s.val.toLocaleString()}</div>
                                <div className="stat-label">{s.label}</div>
                                <div className="stat-icon"><Icon name={s.icon} /></div>
                            </div>
                        ))}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16, marginBottom: 20 }} className="chart-grid">
                        <div className="card" style={{ padding: 22 }}>
                            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.96rem', marginBottom: 16, color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                                <Icon name="chart-pie" />คำตอบรายเดือน
                            </h3>
                            <div className="chart-wrap"><canvas ref={chartRef} /></div>
                        </div>
                        <div className="card" style={{ padding: 22 }}>
                            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.96rem', marginBottom: 16, color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                                <Icon name="chart-pie" />สัดส่วน
                            </h3>
                            <div className="chart-wrap">
                                {forms.length > 0 ? <canvas ref={chartRef2} /> :
                                    <div style={{ textAlign: 'center', padding: 40, color: 'var(--txt3)' }}>ยังไม่มีข้อมูล</div>}
                            </div>
