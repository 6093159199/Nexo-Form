        function Icon({ name, size = '1em', className = '', style = {}, fill = false }) {
            if (name === 'spinner') {
                return (
                    <svg className={`svg-icon spinner-svg ${className}`} style={{ width: size, height: size, ...style }} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                );
            }
            const pathData = iconPaths[name];
            if (!pathData) return null;
            return (
                <svg
                    className={`svg-icon ${fill ? 'svg-icon-fill' : ''} ${className}`}
                    style={{ width: size, height: size, ...style }}
                    viewBox="0 0 24 24"
                    fill={fill ? 'currentColor' : 'none'}
                    stroke={fill ? 'none' : 'currentColor'}
                    strokeWidth={fill ? 0 : 2}
                    strokeLinecap="round"
                    strokeLinejoin="round"
                >
                    <path d={pathData} />
                </svg>
            );
        }

        // ฟังก์ชันสำหรับดูว่าไฟล์เป็นรูปภาพหรือไม่
        const isImageFile = (mimeType) => mimeType && mimeType.startsWith('image/');

        // ฟังก์ชันสำหรับหาไอคอนตามประเภทไฟล์
        const getFileIcon = (mimeType) => {
            if (!mimeType) return 'file';
            if (mimeType.startsWith('image/')) return 'file-image';
            if (mimeType.includes('pdf')) return 'file-pdf';
            if (mimeType.includes('word') || mimeType.includes('document')) return 'file-lines';
            if (mimeType.includes('spreadsheet') || mimeType.includes('excel')) return 'file-lines';
            if (mimeType.includes('zip') || mimeType.includes('rar') || mimeType.includes('compressed')) return 'file';
            return 'file';
        };

        // ฟังก์ชันฟอร์แมตขนาดไฟล์
        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

            document.documentElement.setAttribute('data-theme', themeId);

        function getThemeColors() {
            const style = getComputedStyle(document.documentElement);
            return {
                p1: style.getPropertyValue('--p1').trim() || '#F8B4C8',
                p3: style.getPropertyValue('--p3').trim() || '#E879A0',
                bg: style.getPropertyValue('--bg').trim() || '#FFF5F8',

                timer: 2500,
                timerProgressBar: true,

                color: colors.txt,
            });
            return Toast.fire({ icon, title });

        function useRipple() {
            return useCallback((e) => {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const span = document.createElement('span');
                span.className = 'ripple-effect';
                span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px`;
                btn.appendChild(span);
                setTimeout(() => span.remove(), 600);
            }, []);
        }

        /* ============================================
           GAS CONFIG — เชื่อมต่อ Google Apps Script
        ============================================ */
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzjebIKqR0G91MKXODUhbZgdpq6gsUaPLaZ05kFEAvAgc7syI1kbeeupB79LZm1GYnVoQ/exec';
        const GAS_TOKEN = 'FormFlow_Secret_2024_XyZ!@#';

        async function gasPost(payload) {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ ...payload, token: GAS_TOKEN }),
            });
            return res.json();
        }

        async function gasGet(params = {}) {
            const qs = new URLSearchParams({ ...params, token: GAS_TOKEN }).toString();
            const res = await fetch(`${GAS_URL}?${qs}`);
            return res.json();
        }

        // ฟังก์ชันอัปโหลดไฟล์ไปยัง GAS
        async function uploadFileToGAS(formId, questionId, file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('formId', formId);
            formData.append('questionId', questionId);
            formData.append('fileName', file.name);
            formData.append('token', GAS_TOKEN);
            formData.append('action', 'uploadFile');

            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: formData
            });
            return res.json();
        }

        // ฟังก์ชันดาวน์โหลดไฟล์
        function downloadFileFromGAS(fileId, fileName) {
            const url = `${GAS_URL}?action=download&fileId=${fileId}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ฟังก์ชันดึง URL สำหรับ preview รูปภาพ
        function getPreviewUrl(fileId) {
            return `${GAS_URL}?action=preview&fileId=${fileId}`;
        }

        /* ============================================
           STORE
        ============================================ */
        function useStore() {
            const [forms, setForms] = useState([]);
            const [responses, setResponses] = useState({});
            const [gasLoading, setGasLoading] = useState(true);
            const [gasError, setGasError] = useState(null);

            useEffect(() => {
                let cancelled = false;
                setGasLoading(true);
                setGasError(null);
                gasGet({ action: 'getAll' })
                    .then(data => {
                        if (cancelled) return;
                        if (data.error) { setGasError(data.error); return; }
                        if (Array.isArray(data.forms)) setForms(data.forms);
                        if (data.responses && typeof data.responses === 'object') setResponses(data.responses);
                    })
                    .catch(err => { if (!cancelled) setGasError(err.message); })
                    .finally(() => { if (!cancelled) setGasLoading(false); });
                return () => { cancelled = true; };
            }, []);

            const saveForms = useCallback(async (f) => {
                setForms(f);
                await gasPost({ action: 'saveForms', forms: f });
            }, []);

            const saveResp = useCallback(async (r) => {
                setResponses(r);
                await gasPost({ action: 'saveResponses', responses: r });
            }, []);

            const addForm = useCallback(async (form) => {
                const n = { ...form, id: generateId(), createdAt: new Date().toISOString(), active: true, responseCount: 0 };
                const updated = [...forms, n];
                await saveForms(updated);
                return n;
            }, [forms, saveForms]);

            const updateForm = useCallback(async (id, d) => {
                const updated = forms.map(f => f.id === id ? { ...f, ...d } : f);
                await saveForms(updated);
            }, [forms, saveForms]);

            const deleteForm = useCallback(async (id) => {
                const updatedForms = forms.filter(f => f.id !== id);
                const updatedResp = { ...responses };
                delete updatedResp[id];
                setForms(updatedForms);
                setResponses(updatedResp);
                await gasPost({ action: 'saveAll', forms: updatedForms, responses: updatedResp });
            }, [forms, responses]);

            const addResponse = useCallback(async (formId, data) => {
                const r = { ...responses };
                if (!r[formId]) r[formId] = [];
                r[formId] = [...r[formId], { id: generateId(), submittedAt: new Date().toISOString(), data }];
                const updatedForms = forms.map(f => f.id === formId ? { ...f, responseCount: (f.responseCount || 0) + 1 } : f);
                setResponses(r);
                setForms(updatedForms);
                await gasPost({ action: 'saveAll', forms: updatedForms, responses: r });
            }, [responses, forms]);

            return { forms, responses, addForm, updateForm, deleteForm, addResponse, gasLoading, gasError };
        }

        /* ——— COMPONENTS ——— */

        function Toast({ msg, type = 'success', onDone }) {
            useEffect(() => { const t = setTimeout(onDone, 3200); return () => clearTimeout(t); }, []);
            const bg = type === 'success' ? 'linear-gradient(135deg,#90D4B0,#2BAF80)'
                : type === 'error' ? 'linear-gradient(135deg,#FFAAB0,#FF6070)'
                    : 'linear-gradient(135deg,var(--p1),var(--p3))';
            const icon = type === 'success' ? 'circle-check' : type === 'error' ? 'circle-xmark' : 'circle-info';
            return <div className="toast-ff" style={{ background: bg }}><Icon name={icon} /> {msg}</div>;
        }

        function ScrollProgress() {
            const [w, setW] = useState(0);
            useEffect(() => {
                const h = () => { const d = document.documentElement; setW(d.scrollHeight - innerHeight > 0 ? scrollY / (d.scrollHeight - innerHeight) * 100 : 0); };
                addEventListener('scroll', h);
                return () => removeEventListener('scroll', h);
            }, []);
            return <div className="scroll-progress" style={{ width: `${w}%` }} />;
        }

        function FloatingDecorations() {
            const emojis = useMemo(() => ['🌸', '🌺', '🌷', '🍓', '🎀', '🍬', '🧁', '🍩', '✨', '💫', '🌟', '🦋', '🌈', '🌻', '🍭', '🎊'], []);
            const items = useMemo(() => Array.from({ length: 20 }, (_, i) => ({
                id: i, left: Math.random() * 100, delay: Math.random() * 10,
                size: 14 + Math.random() * 18, duration: 8 + Math.random() * 6,
                emoji: emojis[Math.floor(Math.random() * emojis.length)]
            })), []);
            return (
                <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 0 }}>
                    {items.map(it => (
                        <div key={it.id} className="floating-decor" style={{
                            left: `${it.left}%`, bottom: '-50px',
                            fontSize: `${it.size}px`,
                            animationDelay: `${it.delay}s`,
                            animationDuration: `${it.duration}s`
                        }}>{it.emoji}</div>
                    ))}
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [pw, setPw] = useState('');
            const [err, setErr] = useState('');
            const [loading, setLoading] = useState(false);
            const addRipple = useRipple();

            const handleLogin = async e => {
                e.preventDefault();
                setLoading(true);
                setErr('');
                try {
                    const data = await gasGet({ action: 'getAll' });
                    const PASS = (data.settings?.adminpw) || 'admin1234';
                    sessionStorage.setItem('ff_adminpw_cache', PASS);
                    if (pw === PASS) {
                        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, colors: ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#FFE070'] });
                        onLogin();
                    } else {
                        setErr('💔 รหัสผ่านไม่ถูกต้อง ลองใหม่นะคะ~');
                        showErrorAlert('เข้าสู่ระบบไม่สำเร็จ', 'รหัสผ่านไม่ถูกต้องนะคะ ลองใหม่อีกครั้ง~');
                    }
                } catch (ex) {
                    const PASS = sessionStorage.getItem('ff_adminpw_cache') || 'admin1234';
                    if (pw === PASS) {
                        onLogin();
                    } else {
                        setErr('💔 รหัสผ่านไม่ถูกต้อง / เชื่อมต่อ Sheets ไม่ได้');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="login-wrap">
                    <FloatingDecorations />
                    <div className="login-card bounce-in">
                        <div style={{ fontSize: '3rem', marginBottom: 4 }}>🌸</div>
                        <div className="login-logo">FormFlow</div>
                        <p style={{ color: 'var(--txt2)', marginBottom: 30, fontSize: '0.92rem', fontFamily: 'var(--font-display)' }}>
                            ✨ ระบบสร้างและจัดการแบบฟอร์มอัจฉริยะ
                        </p>
                        <form onSubmit={handleLogin}>
                            <div style={{ marginBottom: 16 }}>
                                <input type="password" className="login-input"
                                    placeholder="🔐 รหัสผ่านผู้ดูแลระบบ"
                                    value={pw} onChange={e => { setPw(e.target.value); setErr(''); }} autoFocus />
                            </div>
                            {err && (
                                <div style={{ background: 'rgba(255,96,112,0.1)', color: '#D04060', padding: '10px 16px', borderRadius: 40, marginBottom: 16, fontSize: '0.85rem', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <Icon name="circle-exclamation" /> {err}
                                </div>
                            )}
                            <button type="submit" className="btn btn-primary ripple" style={{ width: '100%', justifyContent: 'center', padding: '14px', fontSize: '0.95rem' }} disabled={loading} onClick={addRipple}>
                                {loading ? <><Icon name="spinner" /> กำลังเข้าสู่ระบบ...</> : <><Icon name="arrow-right-to-bracket" /> เข้าสู่ระบบ</>}
                            </button>
                        </form>
                        <p style={{ color: 'var(--txt3)', fontSize: '0.75rem', marginTop: 22 }}>
                            <Icon name="shield-halved" style={{ marginRight: 5 }} />
                            รหัสผ่านเริ่มต้น: <strong>admin1234</strong>
                        </p>
                    </div>
                </div>
            );
        }

            const nav = [
                { id: 'dashboard', icon: 'house-chimney', label: 'แดชบอร์ด' },
                { id: 'forms', icon: 'file-heart', label: 'ฟอร์มทั้งหมด' },
                { id: 'responses', icon: 'inbox', label: 'คำตอบ' },

                            <div key={item.id} className={`nav-item ${page === item.id ? 'active' : ''}`}
                                onClick={() => { setPage(item.id); onClose(); }}>
                                <div className="nav-icon"><Icon name={item.icon} /></div>

                        ))}
                        <div style={{ marginTop: 'auto', padding: '10px 0' }}>
                            <div className="nav-item" onClick={handleLogout} style={{ color: '#D04060' }}>
                                <div className="nav-icon" style={{ background: 'rgba(208,64,96,0.1)' }}><Icon name="arrow-right-from-bracket" /></div>
                                ออกจากระบบ
                            </div>
                        </div>
                        <div className="sidebar-footer">🌸 FormFlow v3.0 Pastel</div>
                    </nav>
                </>

        }

        function ThemePicker({ currentTheme, onThemeChange, accent, onAccentChange }) {
            return (
                <div>
                    <div className="theme-preview-bar" />
                    <p style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--txt3)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 12 }}>
                        🎨 เลือกธีมสี
                    </p>
                    <div className="theme-grid">
                        {THEMES.map(t => (
                            <div key={t.id} className={`theme-swatch ${currentTheme === t.id ? 'active' : ''}`}
                                onClick={() => {
                                    onThemeChange(t.id);
                                    showToast('success', `เปลี่ยนเป็นธีม ${t.label} แล้ว!`);

                                <div className="theme-swatch-dot" style={{
                                    background: `linear-gradient(135deg, ${t.dot[0]}, ${t.dot[1]})`
                                }} />
                                <span style={{ fontSize: '0.68rem' }}>{t.label}</span>
                            </div>
                        ))}
                    </div>
                    <div className="custom-color-row">
                        <span style={{ fontSize: '0.72rem', color: 'var(--txt3)', fontWeight: 700 }}>กำหนดเอง:</span>
                        <input type="color" value={accent} onChange={e => onAccentChange(e.target.value)} />
                        <span style={{ fontSize: '0.75rem', color: 'var(--txt3)', fontFamily: 'monospace' }}>{accent}</span>
                    </div>

        }

        function TopBar({ title, onMenuClick, theme, onThemeChange, accent, onAccentChange, onLogout }) {
            const [showTheme, setShowTheme] = useState(false);
            const addRipple = useRipple();

            const handleLogout = () => {
                const colors = getThemeColors();
                Swal.fire({
                    title: 'ออกจากระบบ?',
                    text: 'คุณแน่ใจหรือไม่ที่จะออกจากระบบ?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: '🚪 ใช่ ออกจากระบบ',
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then((result) => {
                    if (result.isConfirmed) {
                        onLogout();
                    }
                });
            };

            return (
                <div className="topbar">
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>

                            <Icon name="bars" />
                        </button>

                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, position: 'relative' }}>
                        <button className="btn-icon" onClick={handleLogout} title="ออกจากระบบ">

                        </button>
                        <button className="btn-icon" onClick={() => setShowTheme(!showTheme)} title="เปลี่ยนธีม">
                            <Icon name="sliders" />
                        </button>
                        {showTheme && (
                            <div className="theme-picker-panel">
                                <ThemePicker currentTheme={theme} onThemeChange={t => { onThemeChange(t); setShowTheme(false); }} accent={accent} onAccentChange={onAccentChange} />
                            </div>
                        )}

                </div>

        }

        function QuestionModal({ question, onSave, onClose }) {
            const isEdit = !!question?.id;
            const [data, setData] = useState({
                title: question?.title || '', type: question?.type || 'short',
                required: question?.required || false,
                options: question?.options || ['ตัวเลือกที่ 1'],
                placeholder: question?.placeholder || '',
                fileTypes: question?.fileTypes || ALLOWED_EXTENSIONS,
                maxFileSize: question?.maxFileSize || MAX_FILE_SIZE,
            });
            const set = (k, v) => setData(d => ({ ...d, [k]: v }));
            const needsOpts = ['multiple', 'dropdown'].includes(data.type);
            const isFileType = data.type === 'file';
            const addRipple = useRipple();

            const handleSave = () => {
                if (!data.title.trim()) {
                    showWarningAlert('กรุณากรอกข้อมูล', '💬 ใส่ชื่อคำถามด้วยนะ~');
                    return;
                }
                onSave(data);
                onClose();
            };

            return (
                <div className="modal-overlay" style={{ zIndex: 1100 }} onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card">
                        <div className="modal-title">
                            <Icon name={isEdit ? 'pen-to-square' : 'plus'} />
                            {isEdit ? 'แก้ไขคำถาม' : 'เพิ่มคำถามใหม่'}
                        </div>
                        <div className="form-field">
                            <label>ชื่อคำถาม *</label>
                            <input className="form-input" placeholder="เช่น คุณชอบอะไรมากที่สุด?" value={data.title} onChange={e => set('title', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>ประเภทคำถาม</label>
                            <select className="form-input" value={data.type} onChange={e => set('type', e.target.value)}>
                                {QUESTION_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                            </select>
                        </div>

                        {!isFileType && (
                            <div className="form-field">
                                <label>ข้อความแนะนำ</label>
                                <input className="form-input" placeholder="ข้อความแสดงในช่อง" value={data.placeholder} onChange={e => set('placeholder', e.target.value)} />
                            </div>
                        )}

                        {isFileType && (
                            <>
                                <div className="form-field">
                                    <label>📋 คำแนะนำการอัปโหลด</label>
                                    <input className="form-input" placeholder="เช่น อัปโหลดรูปภาพหรือเอกสาร..." value={data.placeholder} onChange={e => set('placeholder', e.target.value)} />
                                </div>
                                <div className="form-field">
                                    <label>📁 ประเภทไฟล์ที่รองรับ (นามสกุลไฟล์)</label>
                                    <input className="form-input" value={data.fileTypes} onChange={e => set('fileTypes', e.target.value)} placeholder=".jpg,.png,.pdf" />
                                    <small style={{ color: 'var(--txt3)', fontSize: '0.75rem' }}>ค่าเริ่มต้น: {ALLOWED_EXTENSIONS}</small>
                                </div>
                                <div className="form-field">
                                    <label>📏 ขนาดไฟล์สูงสุด (MB)</label>
                                    <input type="number" className="form-input" value={Math.round(data.maxFileSize / (1024 * 1024))} onChange={e => set('maxFileSize', parseInt(e.target.value) * 1024 * 1024)} min="1" max="50" />
                                    <small style={{ color: 'var(--txt3)', fontSize: '0.75rem' }}>สูงสุด 50MB (แนะนำไม่เกิน 10MB)</small>
                                </div>
                            </>
                        )}

                        {needsOpts && (
                            <div className="form-field">
                                <label>🎯 ตัวเลือก</label>
                                {data.options.map((o, i) => (
                                    <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                                        <input className="form-input" value={o} onChange={e => set('options', data.options.map((x, j) => j === i ? e.target.value : x))} style={{ flex: 1 }} />
                                        {data.options.length > 1 && <button className="btn-icon" onClick={() => set('options', data.options.filter((_, j) => j !== i))}><Icon name="xmark" /></button>}
                                    </div>
                                ))}
                                <button className="btn btn-ghost" style={{ fontSize: '0.82rem', padding: '7px 14px' }} onClick={() => set('options', [...data.options, `ตัวเลือกที่ ${data.options.length + 1}`])}>
                                    <Icon name="plus" /> เพิ่มตัวเลือก
                                </button>
                            </div>
                        )}
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 0' }}>
                            <span style={{ fontWeight: 600, fontSize: '0.88rem', fontFamily: 'var(--font-display)', color: 'var(--txt2)' }}>🔴 คำถามบังคับ</span>
                            <label className="toggle"><input type="checkbox" checked={data.required} onChange={e => set('required', e.target.checked)} /><span className="toggle-slider" /></label>
                        </div>
                        <div className="divider" />
                        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button className="btn btn-ghost" onClick={onClose}><Icon name="xmark" /> ยกเลิก</button>
                            <button className="btn btn-primary ripple" onClick={e => { addRipple(e); handleSave(); }}><Icon name="check" /> บันทึก</button>
                        </div>
                    </div>
                </div>
            );
        }

        function FormModal({ form, onSave, onClose }) {
            const isEdit = !!form?.id;
            const [data, setData] = useState({
                title: form?.title || '', description: form?.description || '',
                accentColor: form?.accentColor || '#F8B4C8',
                bgColor: form?.bgColor || '#FFF5F8',
                headerImage: form?.headerImage || '',
                questions: form?.questions || [], active: form?.active !== undefined ? form.active : true,
            });
            const [qModal, setQModal] = useState(null);
            const [dragIdx, setDragIdx] = useState(null);
            const addRipple = useRipple();
            const set = (k, v) => setData(d => ({ ...d, [k]: v }));
            const addQ = q => { set('questions', [...data.questions, { id: generateId(), ...q }]); setQModal(null); };
            const updateQ = (id, q) => set('questions', data.questions.map(x => x.id === id ? { ...x, ...q } : x));
            const deleteQ = id => {
                const question = data.questions.find(q => q.id === id);
                showDeleteConfirm('ลบคำถาม?', `คุณแน่ใจหรือไม่ที่จะลบ "${question?.title || '(ไม่มีชื่อ)'}"? การกระทำนี้ไม่สามารถย้อนกลับได้`)
                    .then((result) => {
                        if (result.isConfirmed) {
                            set('questions', data.questions.filter(x => x.id !== id));
                            showSuccessAlert('ลบคำถามแล้ว', 'คำถามถูกลบเรียบร้อยแล้ว');
                        }
                    });
            };
            const handleSave = () => {
                if (!data.title.trim()) {
                    showWarningAlert('กรุณากรอกข้อมูล', '💬 ต้องมีชื่อฟอร์มนะ~');
                    return;
                }
                onSave(data);
            };
            const dragStart = idx => setDragIdx(idx);
            const dragOver = (e, idx) => {
                e.preventDefault(); if (dragIdx === null || dragIdx === idx) return;
                const qs = [...data.questions]; const [m] = qs.splice(dragIdx, 1); qs.splice(idx, 0, m);
                set('questions', qs); setDragIdx(idx);
            };

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card">
                        <div className="modal-title">
                            <Icon name={isEdit ? 'pen-to-square' : 'file-circle-plus'} />
                            {isEdit ? 'แก้ไขฟอร์ม' : 'สร้างฟอร์มใหม่'}
                        </div>
                        <div className="form-field">
                            <label>ชื่อฟอร์ม *</label>
                            <input className="form-input" placeholder="เช่น แบบสำรวจขนมหวาน 🍰" value={data.title} onChange={e => set('title', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>คำอธิบาย</label>
                            <textarea className="form-input" placeholder="อธิบายรายละเอียดฟอร์ม..." value={data.description} onChange={e => set('description', e.target.value)} />
                        </div>
                        <div className="form-field">
                            <label>รูปภาพส่วนหัว (URL หรืออีโมจิ)</label>
                            <input className="form-input" placeholder="https://... หรือ 🍰" value={data.headerImage} onChange={e => set('headerImage', e.target.value)} />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                            <div className="form-field">
                                <label>สีหลัก</label>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <input type="color" value={data.accentColor} onChange={e => set('accentColor', e.target.value)} />
                                    <span style={{ color: 'var(--txt3)', fontSize: '0.8rem', fontFamily: 'monospace' }}>{data.accentColor}</span>
                                </div>
                            </div>
                            <div className="form-field">
                                <label>สีพื้นหลัง</label>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <input type="color" value={data.bgColor} onChange={e => set('bgColor', e.target.value)} />
                                    <span style={{ color: 'var(--txt3)', fontSize: '0.8rem', fontFamily: 'monospace' }}>{data.bgColor}</span>
                                </div>
                            </div>
                        </div>
                        <div className="divider" />
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                            <span style={{ fontWeight: 600, fontSize: '0.88rem', fontFamily: 'var(--font-display)', color: 'var(--txt2)' }}>เปิดรับคำตอบ</span>
                            <label className="toggle"><input type="checkbox" checked={data.active} onChange={e => set('active', e.target.checked)} /><span className="toggle-slider" /></label>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                            <span style={{ fontWeight: 700, fontSize: '0.92rem', color: 'var(--txt)' }}>คำถาม ({data.questions.length})</span>
                            <button className="btn btn-primary ripple" style={{ padding: '7px 14px', fontSize: '0.8rem' }} onClick={e => { addRipple(e); setQModal({}); }}>
                                <Icon name="plus" /> เพิ่มคำถาม
                            </button>
                        </div>
                        {data.questions.length === 0 && (
                            <div style={{ textAlign: 'center', padding: '28px', color: 'var(--txt3)', border: '2px dashed var(--border)', borderRadius: 'var(--radius)' }}>
                                <Icon name="circle-question" style={{ fontSize: '2.2rem', marginBottom: 10, display: 'block', color: 'var(--p1)' }} />
                                <p style={{ fontWeight: 600, fontSize: '0.9rem' }}>ยังไม่มีคำถาม</p>
                                <p style={{ fontSize: '0.82rem', marginTop: 4 }}>คลิก "เพิ่มคำถาม" เพื่อเริ่มสร้าง</p>
                            </div>
                        )}
                        {data.questions.map((q, idx) => (
                            <div key={q.id} className="question-item card"
                                draggable onDragStart={() => dragStart(idx)} onDragOver={e => dragOver(e, idx)} onDragEnd={() => setDragIdx(null)}
                                style={{ ...(dragIdx === idx ? { opacity: 0.5, transform: 'scale(0.98)' } : {}) }}>
                                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                                    <Icon name="grip-vertical" style={{ color: 'var(--txt3)', marginTop: 4, cursor: 'grab' }} />
                                    <div style={{ flex: 1 }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                                            <span className="q-type-badge">
                                                <Icon name={QUESTION_TYPES.find(t => t.value === q.type)?.icon || 'circle-question'} />
                                                {QUESTION_TYPES.find(t => t.value === q.type)?.label || q.type}
                                            </span>
                                            {q.required && <span className="chip" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)', background: 'rgba(208,64,96,0.06)' }}>จำเป็น*</span>}
                                        </div>
                                        <p style={{ fontWeight: 600, fontSize: '0.9rem' }}>{q.title || '(ไม่มีชื่อ)'}</p>
                                        {q.options?.length > 0 && <p style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginTop: 2 }}>{q.options.length} ตัวเลือก</p>}
                                        {q.type === 'file' && <p style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginTop: 2 }}>📁 รองรับไฟล์: {q.fileTypes || ALLOWED_EXTENSIONS}</p>}
                                    </div>
                                    <div style={{ display: 'flex', gap: 5 }}>
                                        <button className="btn-icon" onClick={() => setQModal(q)}><Icon name="pen-to-square" /></button>
                                        <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} onClick={() => deleteQ(q.id)}><Icon name="trash-can" /></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                        <div className="divider" />
                        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button className="btn btn-ghost" onClick={onClose}><Icon name="xmark" /> ยกเลิก</button>
                            <button className="btn btn-primary ripple" onClick={e => { addRipple(e); handleSave(); }}><Icon name="floppy-disk" /> บันทึกฟอร์ม</button>
                        </div>
                    </div>
                    {qModal !== null && (
                        <QuestionModal question={qModal} onSave={q => qModal.id ? updateQ(qModal.id, q) : addQ(q)} onClose={() => setQModal(null)} />
                    )}
                </div>
            );
        }

        // File Preview Modal
        function FilePreviewModal({ fileInfo, onClose }) {
            const isImage = fileInfo && isImageFile(fileInfo.mimeType);
            const previewUrl = fileInfo ? getPreviewUrl(fileInfo.id) : '';

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card" style={{ maxWidth: 700 }}>
                        <div className="modal-title">
                            <Icon name="eye" /> ดูไฟล์
                        </div>
                        {fileInfo && (
                            <>
                                <div style={{ marginBottom: 16 }}>
                                    <p style={{ fontWeight: 700, fontSize: '1rem', marginBottom: 4 }}>{fileInfo.name}</p>
                                    <p style={{ color: 'var(--txt3)', fontSize: '0.82rem' }}>
                                        ขนาด: {formatFileSize(fileInfo.size)} |
                                        ประเภท: {fileInfo.mimeType} |
                                        อัปโหลดเมื่อ: {new Date(fileInfo.createdDate || fileInfo.uploadedAt).toLocaleString('th-TH')}
                                    </p>
                                </div>
                                {isImage ? (
                                    <div style={{ textAlign: 'center', background: '#00000010', borderRadius: 'var(--radius)', padding: 16, marginBottom: 16 }}>
                                        <img src={previewUrl} alt={fileInfo.name} style={{ maxWidth: '100%', maxHeight: 500, objectFit: 'contain', borderRadius: 'var(--radius-sm)' }} />
                                    </div>
                                ) : (
                                    <div style={{ textAlign: 'center', padding: 40, background: 'var(--bg2)', borderRadius: 'var(--radius)', marginBottom: 16 }}>
                                        <Icon name={getFileIcon(fileInfo.mimeType)} size="4em" style={{ color: 'var(--p3)', marginBottom: 12 }} />
                                        <p style={{ color: 'var(--txt2)', fontWeight: 600 }}>ไม่สามารถแสดงตัวอย่างไฟล์นี้ได้</p>
                                        <p style={{ color: 'var(--txt3)', fontSize: '0.85rem' }}>กรุณาดาวน์โหลดเพื่อดูไฟล์</p>
                                    </div>
                                )}
                                <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
                                    <button className="btn btn-primary ripple" onClick={() => downloadFileFromGAS(fileInfo.id, fileInfo.name)}>
                                        <Icon name="download" /> ดาวน์โหลด
                                    </button>
                                    <button className="btn btn-ghost" onClick={onClose}>
                                        <Icon name="xmark" /> ปิด
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function DashboardPage({ forms, responses }) {
            const totalForms = forms.length;
            const activeForms = forms.filter(f => f.active).length;
            const totalResp = Object.values(responses).reduce((s, a) => s + a.length, 0);
            const thisMonth = Object.values(responses).flat().filter(r => new Date(r.submittedAt).getMonth() === new Date().getMonth()).length;
            const stats = [
                { label: 'ฟอร์มทั้งหมด', val: totalForms, icon: 'file-heart' },
                { label: 'เปิดใช้งาน', val: activeForms, icon: 'circle-check' },
                { label: 'คำตอบทั้งหมด', val: totalResp, icon: 'inbox' },
                { label: 'เดือนนี้', val: thisMonth, icon: 'calendar-days' },
            ];
            const chartRef = useRef(null), chartRef2 = useRef(null), c1 = useRef(null), c2 = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;
                c1.current?.destroy();
                const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                const counts = Array(12).fill(0);
                Object.values(responses).flat().forEach(r => counts[new Date(r.submittedAt).getMonth()]++);
                const style = getComputedStyle(document.documentElement);
                const p1 = style.getPropertyValue('--p1').trim() || '#F8B4C8';
                const p3 = style.getPropertyValue('--p3').trim() || '#E879A0';
                c1.current = new Chart(chartRef.current, {
                    type: 'bar',
                    data: {
                        labels: months, datasets: [{
                            label: 'คำตอบ', data: counts,
                            backgroundColor: `${p1}88`, borderColor: p3, borderWidth: 2, borderRadius: 10
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(128,128,128,0.08)' }, ticks: { color: 'var(--txt3)' } },
                            x: { grid: { display: false }, ticks: { color: 'var(--txt3)' } }
                        }
                    }
                });
                return () => c1.current?.destroy();
            }, [responses]);

            useEffect(() => {
                if (!chartRef2.current || forms.length === 0) return;
                c2.current?.destroy();
                const colors = ['#F8B4C8', '#C4B5F4', '#90E0C8', '#FFB085', '#90C8F0', '#FFE070'];
                c2.current = new Chart(chartRef2.current, {
                    type: 'doughnut',
                    data: {
                        labels: forms.map(f => f.title.length > 14 ? f.title.slice(0, 14) + '…' : f.title),
                        datasets: [{
                            data: forms.map(f => (responses[f.id] || []).length || 1),
                            backgroundColor: colors.slice(0, forms.length), borderWidth: 3, borderColor: 'rgba(255,255,255,0.8)', hoverOffset: 14
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { color: 'var(--txt2)', padding: 14, font: { size: 11 }, usePointStyle: true, pointStyleWidth: 8 } } }
                    }
                });
                return () => c2.current?.destroy();
            }, [forms, responses]);

            return (
                <div className="stagger">
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 16, marginBottom: 24 }}>
                        {stats.map((s, i) => (
                            <div key={i} className="card stat-card">
                                <div style={{ fontSize: '1.6rem', marginBottom: 6 }}>
                                    <Icon name={s.icon} size="1.6em" />
                                </div>
                                <div className="stat-number">{s.val.toLocaleString()}</div>
                                <div className="stat-label">{s.label}</div>
                                <div className="stat-icon"><Icon name={s.icon} /></div>
                            </div>
                        ))}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16, marginBottom: 20 }} className="chart-grid">
                        <div className="card" style={{ padding: 22 }}>
                            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.96rem', marginBottom: 16, color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                                <Icon name="chart-pie" />คำตอบรายเดือน
                            </h3>
                            <div className="chart-wrap"><canvas ref={chartRef} /></div>
                        </div>
                        <div className="card" style={{ padding: 22 }}>
                            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.96rem', marginBottom: 16, color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                                <Icon name="chart-pie" />สัดส่วน
                            </h3>
                            <div className="chart-wrap">
                                {forms.length > 0 ? <canvas ref={chartRef2} /> :
                                    <div className="empty-state"><div className="empty-state-emoji"><Icon name="chart-pie" size="3.5rem" /></div><div className="empty-state-sub">ยังไม่มีข้อมูล</div></div>}
                            </div>
                        </div>
                    </div>
                    <div className="card" style={{ padding: 22 }}>
                        <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.96rem', marginBottom: 16, color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                            <Icon name="clock-rotate-left" />ฟอร์มล่าสุด
                        </h3>
                        {forms.length === 0 ? (
                            <div className="empty-state"><div className="empty-state-emoji"><Icon name="file-heart" size="3.5rem" /></div><div className="empty-state-title">ยังไม่มีฟอร์ม</div></div>
                        ) : forms.slice().reverse().slice(0, 5).map(f => (
                            <div key={f.id} className="card" style={{ padding: '14px 18px', marginBottom: 10, borderLeft: `4px solid ${f.accentColor || 'var(--p3)'}` }}>
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8 }}>
                                    <div>
                                        <div style={{ fontWeight: 700, fontSize: '0.9rem' }}>{f.title}</div>
                                        <div style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginTop: 3 }}>
                                            <Icon name="inbox" style={{ marginRight: 4 }} />{(responses[f.id] || []).length} คำตอบ
                                            <span style={{ margin: '0 8px' }}>·</span>
                                            <Icon name="list-check" style={{ marginRight: 4 }} />{(f.questions || []).length} คำถาม
                                        </div>
                                    </div>
                                    <span className={`badge ${f.active ? 'badge-on' : 'badge-off'}`}>{f.active ? 'เปิด' : 'ปิด'}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function FormsPage({ forms, responses, onAdd, onEdit, onDelete, onToggle, onViewUrl }) {
            const [search, setSearch] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editForm, setEditForm] = useState(null);
            const addRipple = useRipple();
            const filtered = forms.filter(f => f.title.toLowerCase().includes(search.toLowerCase()));

            const handleSave = data => {
                if (editForm?.id) {
                    onEdit(editForm.id, data);
                    showSuccessAlert('อัปเดตฟอร์มแล้ว!', `ฟอร์ม "${data.title}" ถูกอัปเดตเรียบร้อยแล้ว 🌸`);
                } else {
                    onAdd(data);
                    showSuccessAlert('สร้างฟอร์มสำเร็จ!', `ฟอร์ม "${data.title}" ถูกสร้างเรียบร้อยแล้ว ✨`);
                }
                setShowModal(false);
                setEditForm(null);
            };

            const handleDelete = (form) => {
                showDeleteConfirm('ลบฟอร์ม?', `คุณแน่ใจหรือไม่ที่จะลบ "${form.title}"?<br><small style="color: var(--txt3)">การกระทำนี้จะลบคำตอบทั้งหมดด้วยและไม่สามารถกู้คืนได้</small>`)
                    .then((result) => {
                        if (result.isConfirmed) {
                            onDelete(form.id);
                            showSuccessAlert('ลบฟอร์มแล้ว', `ฟอร์ม "${form.title}" ถูกลบเรียบร้อยแล้ว`);
                        }
                    });
            };

            const handleToggle = (form, newStatus) => {
                const action = newStatus ? 'เปิด' : 'ปิด';
                const colors = getThemeColors();
                Swal.fire({
                    title: `${newStatus ? '📬' : '🔒'} ${action}รับคำตอบ?`,
                    html: `คุณต้องการ${action}รับคำตอบสำหรับฟอร์ม "${form.title}" ใช่หรือไม่?`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: newStatus ? '#2BAF88' : colors.p3,
                    cancelButtonColor: colors.txt2,
                    confirmButtonText: `ใช่ ${action}เลย!`,
                    cancelButtonText: 'ยกเลิก',
                    reverseButtons: true,
                    background: colors.card,
                    color: colors.txt,
                }).then((result) => {
                    if (result.isConfirmed) {
                        onToggle(form.id, newStatus);
                        showToast('success', `${action}รับคำตอบเรียบร้อยแล้ว!`);
                    }
                });
            };

            return (
                <div>
                    <div style={{ display: 'flex', gap: 12, marginBottom: 20, flexWrap: 'wrap' }}>
                        <div style={{ flex: 1, position: 'relative', minWidth: 200 }}>
                            <Icon name="magnifying-glass" style={{ position: 'absolute', left: 18, top: '50%', transform: 'translateY(-50%)', color: 'var(--txt3)' }} />
                            <input className="form-input" style={{ paddingLeft: 46 }} placeholder="🔍 ค้นหาฟอร์ม..." value={search} onChange={e => setSearch(e.target.value)} />
                        </div>
                        <button className="btn btn-primary ripple" onClick={e => { addRipple(e); setEditForm(null); setShowModal(true); }}>
                            <Icon name="plus" /> สร้างฟอร์มใหม่
                        </button>
                    </div>
                    {filtered.length === 0 ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}>
                            <div className="empty-state-emoji"><Icon name="file-heart" size="3.5rem" /></div>
                            <div className="empty-state-title" style={{ fontWeight: 700, marginTop: 10 }}>{search ? 'ไม่พบฟอร์มที่ค้นหา' : 'ยังไม่มีฟอร์ม'}</div>
                            <div className="empty-state-sub" style={{ color: 'var(--txt3)' }}>{search ? 'ลองค้นหาด้วยคำอื่น' : 'คลิก "สร้างฟอร์มใหม่" เพื่อเริ่มต้น~'}</div>
                        </div>
                    ) : (
                        <div className="stagger">
                            {filtered.map(f => (
                                <div key={f.id} className="form-card card">
                                    <div className="form-card-accent-bar" style={{ background: `linear-gradient(90deg,${f.accentColor || 'var(--p1)'},${f.accentColor || 'var(--p3)'})` }} />
                                    <div className="form-card-inner">
                                        <div className="form-card-icon">
                                            {f.headerImage?.startsWith('http') ? <img src={f.headerImage} style={{ width: 36, height: 36, objectFit: 'cover', borderRadius: 12 }} alt="" /> : (f.headerImage || <Icon name="file-heart" size="1.5rem" />)}
                                        </div>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 4 }}>
                                                <span style={{ fontWeight: 700, fontSize: '0.96rem' }}>{f.title}</span>
                                                <span className={`badge ${f.active ? 'badge-on' : 'badge-off'}`}>{f.active ? 'เปิดรับคำตอบ' : 'ปิดรับคำตอบ'}</span>
                                            </div>
                                            {f.description && <p style={{ color: 'var(--txt2)', fontSize: '0.82rem', marginBottom: 8 }}>{f.description}</p>}
                                            <div style={{ display: 'flex', gap: 14, fontSize: '0.78rem', color: 'var(--txt3)', flexWrap: 'wrap' }}>
                                                <span><Icon name="list-check" style={{ marginRight: 4 }} />{(f.questions || []).length} คำถาม</span>
                                                <span><Icon name="inbox" style={{ marginRight: 4 }} />{(responses[f.id] || []).length} คำตอบ</span>
                                                <span><Icon name="calendar" style={{ marginRight: 4 }} />{new Date(f.createdAt).toLocaleDateString('th-TH')}</span>
                                            </div>
                                        </div>
                                        <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                                            <button className="btn-icon" title="ลิงก์ฟอร์ม" onClick={() => onViewUrl(f)}><Icon name="link" /></button>
                                            <label className="toggle" title="เปิด/ปิด" onClick={(e) => { e.stopPropagation(); handleToggle(f, !f.active); }}>
                                                <input type="checkbox" checked={f.active} readOnly />
                                                <span className="toggle-slider" />
                                            </label>
                                            <button className="btn-icon" title="แก้ไข" onClick={() => { setEditForm(f); setShowModal(true); }}><Icon name="pen-to-square" /></button>
                                            <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }} title="ลบ"
                                                onClick={() => handleDelete(f)}>
                                                <Icon name="trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {showModal && <FormModal form={editForm} onSave={handleSave} onClose={() => { setShowModal(false); setEditForm(null); }} />}
                </div>
            );
        }

        function UrlModal({ form, onClose }) {
            const url = getFormUrl(form.id);
            const [copied, setCopied] = useState(false);
            const copy = () => {
                navigator.clipboard?.writeText(url);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
                showToast('success', '📋 คัดลอกลิงก์แล้ว!');
            };
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="modal-box card" style={{ maxWidth: 480 }}>
                        <div className="modal-title"><Icon name="link" />ลิงก์ฟอร์มสาธารณะ</div>
                        <p style={{ color: 'var(--txt2)', marginBottom: 14, fontSize: '0.88rem' }}>แชร์ลิงก์นี้ให้ผู้ตอบแบบสอบถาม</p>
                        <div className="url-box">
                            <span style={{ flex: 1, overflowX: 'auto', whiteSpace: 'nowrap' }}>{url}</span>
                            <button className="btn-icon" onClick={copy} style={{ background: copied ? 'rgba(43,175,136,0.1)' : undefined, color: copied ? '#2BAF88' : undefined }}>
                                <Icon name={copied ? 'check' : 'copy'} />
                            </button>
                        </div>
                        <div style={{ marginTop: 18, display: 'flex', gap: 10 }}>
                            <a href={url} target="_blank" rel="noopener" className="btn btn-primary" style={{ textDecoration: 'none' }}>
                                <Icon name="arrow-up-right-from-square" /> เปิดฟอร์ม
                            </a>
                            <button className="btn btn-ghost" onClick={onClose}>ปิด</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ResponsesPage({ forms, responses }) {
            const [selForm, setSelForm] = useState(forms[0]?.id || '');
            const [viewResp, setViewResp] = useState(null);
            const form = forms.find(f => f.id === selForm);
            const resps = responses[selForm] || [];

            const handleDeleteResponse = (response) => {
                showDeleteConfirm('ลบคำตอบ?', `คุณแน่ใจหรือไม่ที่จะลบคำตอบที่ ${resps.indexOf(response) + 1}?<br><small style="color: var(--txt3)">การกระทำนี้ไม่สามารถย้อนกลับได้</small>`)
                    .then((result) => {
                        if (result.isConfirmed) {
                            showSuccessAlert('ลบคำตอบแล้ว', 'คำตอบถูกลบเรียบร้อยแล้ว');
                        }
                    });
            };

            return (
                <div>
                    <div style={{ marginBottom: 18 }}>
                        <select className="form-input" value={selForm} onChange={e => setSelForm(e.target.value)} style={{ maxWidth: 320 }}>
                            {forms.length === 0 ? <option>— ยังไม่มีฟอร์ม —</option> : forms.map(f => <option key={f.id} value={f.id}>{f.title}</option>)}
                        </select>
                    </div>
                    {!form ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}><div className="empty-state-emoji"><Icon name="inbox" size="3.5rem" /></div><div className="empty-state-sub">เลือกฟอร์มเพื่อดูคำตอบ</div></div>
                    ) : resps.length === 0 ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}><div className="empty-state-emoji"><Icon name="inbox" size="3.5rem" /></div><div className="empty-state-title">ยังไม่มีคำตอบ</div><div className="empty-state-sub">รอให้ผู้ใช้ส่งคำตอบมา~</div></div>
                    ) : (
                        <div className="stagger">
                            {resps.map((r, i) => (
                                <div key={r.id} className="card" style={{ padding: '14px 18px', marginBottom: 10, cursor: 'pointer' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <div onClick={() => setViewResp(r)} style={{ flex: 1 }}>
                                            <span style={{ fontWeight: 700 }}><Icon name="inbox" style={{ marginRight: 6 }} />คำตอบที่ {i + 1}</span>
                                            <span style={{ color: 'var(--txt3)', fontSize: '0.78rem', marginLeft: 12 }}>
                                                <Icon name="clock-rotate-left" style={{ marginRight: 4 }} />{new Date(r.submittedAt).toLocaleString('th-TH')}
                                            </span>
                                        </div>
                                        <div style={{ display: 'flex', gap: 5 }}>
                                            <button className="btn-icon" onClick={() => setViewResp(r)}>
                                                <Icon name="chevron-right" style={{ color: 'var(--txt3)' }} />
                                            </button>
                                            <button className="btn-icon" style={{ color: '#D04060', borderColor: 'rgba(208,64,96,0.3)' }}
                                                onClick={(e) => { e.stopPropagation(); handleDeleteResponse(r); }}>
                                                <Icon name="trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {viewResp && form && (
                        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setViewResp(null)}>
                            <div className="modal-box card">
                                <div className="modal-title"><Icon name="file-lines" /> 📋 รายละเอียดคำตอบ</div>
                                <p style={{ color: 'var(--txt3)', fontSize: '0.82rem', marginBottom: 22 }}>ส่งเมื่อ {new Date(viewResp.submittedAt).toLocaleString('th-TH')}</p>
                                {(form.questions || []).map(q => {
                                    const answer = viewResp.data[q.id];
                                    let fileInfo = null;
                                    if (q.type === 'file' && answer) {
                                        try { fileInfo = JSON.parse(answer); } catch (e) { fileInfo = null; }
                                    }

                                    return (
                                        <div key={q.id} style={{ marginBottom: 14, padding: '12px 16px', background: 'var(--bg2)', borderRadius: 'var(--radius-sm)' }}>
                                            <p style={{ fontWeight: 700, fontSize: '0.76rem', color: 'var(--txt3)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 4 }}>
                                                <Icon name={QUESTION_TYPES.find(t => t.value === q.type)?.icon || 'circle-question'} style={{ marginRight: 4 }} />{q.title}
                                            </p>
                                            {q.type === 'file' && fileInfo ? (
                                                <div style={{ marginTop: 8, padding: '10px 14px', background: 'var(--bg3)', borderRadius: 'var(--radius-sm)' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                                        <Icon name={getFileIcon(fileInfo.mimeType)} size="1.5em" style={{ color: 'var(--p3)' }} />
                                                        <div style={{ flex: 1 }}>
                                                            <p style={{ fontWeight: 600, fontSize: '0.85rem' }}>{fileInfo.name}</p>
                                                            <p style={{ fontSize: '0.75rem', color: 'var(--txt3)' }}>{formatFileSize(fileInfo.size)}</p>
                                                        </div>
                                                        <button className="btn-icon" title="ดาวน์โหลด" onClick={() => downloadFileFromGAS(fileInfo.id, fileInfo.name)}>
                                                            <Icon name="download" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <p style={{ fontWeight: 500, fontSize: '0.9rem' }}>
                                                    {answer || <em style={{ color: 'var(--txt3)' }}>ไม่ได้ตอบ</em>}
                                                </p>
                                            )}
                                        </div>
                                    );
                                })}
                                <div style={{ marginTop: 10, display: 'flex', gap: 10 }}>
                                    <button className="btn btn-ghost" onClick={() => setViewResp(null)}><Icon name="xmark" /> ปิด</button>
                                    <button className="btn btn-danger" onClick={() => {
                                        setViewResp(null);
                                        handleDeleteResponse(viewResp);
                                    }}>
                                        <Icon name="trash-can" /> ลบคำตอบนี้
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AnalyticsPage({ forms, responses }) {
            const [selForm, setSelForm] = useState(forms[0]?.id || '');
            const form = forms.find(f => f.id === selForm);
            const resps = responses[selForm] || [];
            const chartRefs = useRef({}), charts = useRef({});

            useEffect(() => {
                if (!form) return;
                (form.questions || []).filter(q => ['multiple', 'dropdown'].includes(q.type)).forEach(q => {
                    const canvas = chartRefs.current[q.id]; if (!canvas) return;
                    charts.current[q.id]?.destroy();
                    const counts = {}; (q.options || []).forEach(o => counts[o] = 0);
                    resps.forEach(r => { const v = r.data[q.id]; if (v && counts[v] !== undefined) counts[v]++; });
                    const style = getComputedStyle(document.documentElement);
                    const p1 = style.getPropertyValue('--p1').trim() || '#F8B4C8';
                    const p3 = style.getPropertyValue('--p3').trim() || '#E879A0';
                    charts.current[q.id] = new Chart(canvas, {
                        type: 'bar',
                        data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: `${p1}aa`, borderColor: p3, borderWidth: 2, borderRadius: 10 }] },
                        options: {
                            responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { color: 'var(--txt3)' }, grid: { color: 'rgba(128,128,128,0.06)' } }, x: { ticks: { color: 'var(--txt3)' }, grid: { display: false } } }
                        }
                    });
                });
                return () => Object.values(charts.current).forEach(c => c?.destroy());
            }, [selForm, resps]);

            return (
                <div>
                    <div style={{ marginBottom: 18 }}>
                        <select className="form-input" value={selForm} onChange={e => setSelForm(e.target.value)} style={{ maxWidth: 320 }}>
                            {forms.length === 0 ? <option>— ยังไม่มีฟอร์ม —</option> : forms.map(f => <option key={f.id} value={f.id}>{f.title}</option>)}
                        </select>
                    </div>
                    {!form ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}><div className="empty-state-emoji"><Icon name="chart-pie" size="3.5rem" /></div><div className="empty-state-sub">เลือกฟอร์มเพื่อดูการวิเคราะห์</div></div>
                    ) : (
                        <div className="stagger">
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 14, marginBottom: 20 }}>
                                {[
                                    { label: 'คำตอบทั้งหมด', val: resps.length, icon: 'inbox' },
                                    { label: 'จำนวนคำถาม', val: (form.questions || []).length, icon: 'circle-question' },
                                    { label: 'อัตราตอบครบ', val: `${resps.length > 0 ? Math.round(resps.filter(r => Object.keys(r.data).length === (form.questions || []).length).length / resps.length * 100) : 0}%`, icon: 'circle-check' },
                                ].map((s, i) => (
                                    <div key={i} className="card stat-card">
                                        <div style={{ fontSize: '1.4rem', marginBottom: 4 }}>
                                            <Icon name={s.icon} size="1.4em" />
                                        </div>
                                        <div className="stat-number" style={{ fontSize: '2rem' }}>{s.val}</div>
                                        <div className="stat-label">{s.label}</div>
                                    </div>
                                ))}
                            </div>
                            {(form.questions || []).filter(q => ['multiple', 'dropdown'].includes(q.type)).map(q => (
                                <div key={q.id} className="card" style={{ padding: 22, marginBottom: 14 }}>
                                    <h4 style={{ fontWeight: 700, marginBottom: 18, color: 'var(--p3)', fontFamily: 'var(--font-display)' }}>{q.title}</h4>
                                    <div className="chart-wrap"><canvas ref={el => chartRefs.current[q.id] = el} /></div>
                                </div>
                            ))}
                            {(form.questions || []).filter(q => q.type === 'rating').map(q => {
                                const vals = resps.map(r => parseInt(r.data[q.id]) || 0).filter(v => v > 0);
                                const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
                                return (
                                    <div key={q.id} className="card" style={{ padding: 22, marginBottom: 14 }}>
                                        <h4 style={{ fontWeight: 700, marginBottom: 14, color: 'var(--p3)', fontFamily: 'var(--font-display)' }}>{q.title}</h4>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
                                            <div style={{ fontSize: '2.4rem', fontFamily: 'var(--font-display)', fontWeight: 800, color: 'var(--p3)' }}>{avg.toFixed(1)}</div>
                                            <div>
                                                <div style={{ display: 'flex', gap: 4 }}>
                                                    {[1, 2, 3, 4, 5].map(s => {
                                                        const filled = s <= Math.round(avg);
                                                        return <Icon key={s} name={filled ? 'star-filled' : 'star'} style={{ color: filled ? '#FFD060' : 'var(--border)', width: '1.2rem', height: '1.2rem' }} fill={filled} />
                                                    })}
                                                </div>
                                                <div style={{ color: 'var(--txt3)', fontSize: '0.82rem', marginTop: 4 }}>{vals.length} คะแนน</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // หน้าจัดการไฟล์ทั้งหมด
        function FilesPage({ forms }) {
            const [allFiles, setAllFiles] = useState({});
            const [loading, setLoading] = useState(true);
            const [previewFile, setPreviewFile] = useState(null);
            const [selectedForm, setSelectedForm] = useState('all');

            useEffect(() => {
                loadFiles();
            }, []);

            const loadFiles = async () => {
                setLoading(true);
                try {
                    const data = await gasGet({ action: 'getAllFiles' });
                    if (data.allFiles) {
                        setAllFiles(data.allFiles);
                    }
                } catch (err) {
                    console.error('Error loading files:', err);
                    showErrorAlert('โหลดไฟล์ไม่สำเร็จ', 'ไม่สามารถดึงรายการไฟล์ได้');
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteFile = (fileInfo) => {
                showDeleteConfirm('ลบไฟล์?', `คุณแน่ใจหรือไม่ที่จะลบ "${fileInfo.name}"?<br><small style="color: var(--txt3)">การกระทำนี้ไม่สามารถกู้คืนได้</small>`)
                    .then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await gasPost({ action: 'deleteFile', fileId: fileInfo.id });
                                showToast('success', 'ลบไฟล์เรียบร้อยแล้ว!');
                                loadFiles();
                            } catch (err) {
                                showErrorAlert('ลบไฟล์ไม่สำเร็จ', err.message || 'เกิดข้อผิดพลาด');
                            }
                        }
                    });
            };

            // รวมไฟล์ทั้งหมดหรือกรองตามฟอร์ม
            const getDisplayFiles = () => {
                if (selectedForm === 'all') {
                    return Object.entries(allFiles).flatMap(([formId, data]) =>
                        data.files.map(file => ({ ...file, formId, formTitle: data.formTitle }))
                    );
                }
                const formData = allFiles[selectedForm];
                return formData ? formData.files.map(file => ({ ...file, formId: selectedForm, formTitle: formData.formTitle })) : [];
            };

            const displayFiles = getDisplayFiles();
            const formList = Object.entries(allFiles).map(([id, data]) => ({ id, title: data.formTitle, count: data.files.length }));

            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 }}>
                        <h2 style={{ fontFamily: 'var(--font-display)', color: 'var(--p3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                            <Icon name="folder-open" /> ไฟล์ทั้งหมด
                        </h2>
                        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                            <select className="form-input" value={selectedForm} onChange={e => setSelectedForm(e.target.value)} style={{ maxWidth: 250 }}>
                                <option value="all">📁 ทุกฟอร์ม ({displayFiles.length} ไฟล์)</option>
                                {formList.map(f => (
                                    <option key={f.id} value={f.id}>{f.title} ({f.count} ไฟล์)</option>
                                ))}
                            </select>
                            <button className="btn btn-ghost" onClick={loadFiles}>
                                <Icon name="spinner" style={{ animation: loading ? 'spin 1s linear infinite' : 'none' }} /> รีเฟรช
                            </button>
                        </div>
                    </div>

                    {loading ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}>
                            <div className="empty-state-emoji"><Icon name="spinner" size="3.5rem" /></div>
                            <div className="empty-state-sub">กำลังโหลดไฟล์...</div>
                        </div>
                    ) : displayFiles.length === 0 ? (
                        <div className="empty-state" style={{ textAlign: 'center', padding: 60 }}>
                            <div className="empty-state-emoji"><Icon name="cloud-upload-alt" size="3.5rem" /></div>
                            <div className="empty-state-title">ยังไม่มีไฟล์</div>
                            <div className="empty-state-sub">ไฟล์ที่อัปโหลดจากฟอร์มจะแสดงที่นี่</div>
                        </div>
                    ) : (
                        <div className="stagger">
                            {displayFiles.map((file, index) => (
                                <div key={file.id} className="card" style={{ padding: '14px 18px', marginBottom: 10 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                                        <div style={{
                                            width: 48, height: 48, borderRadius: 'var(--radius-sm)',
                                            background: isImageFile(file.mimeType) ? 'transparent' : 'var(--bg2)',
                                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            overflow: 'hidden'
                                        }}>
                                            {isImageFile(file.mimeType) ? (
                                                <img src={getPreviewUrl(file.id)} alt={file.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                            ) : (
                                                <Icon name={getFileIcon(file.mimeType)} size="1.5em" style={{ color: 'var(--p3)' }} />
                                            )}
                                        </div>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <p style={{ fontWeight: 700, fontSize: '0.9rem', marginBottom: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</p>
                                            <p style={{ color: 'var(--txt3)', fontSize: '0.78rem' }}>
                                                {formatFileSize(file.size)} · {file.mimeType?.split('/')[0]}
                                                {file.formTitle && <> · <Icon name="file-heart" style={{ margin: '0 2px' }} /> {file.formTitle}</>}
                                            </p>
                                            <p style={{ color: 'var(--txt3)', fontSize: '0.72rem', marginTop: 2 }}>
                                                {new Date(file.createdDate || file.uploadedAt).toLocaleString('th-TH')}
                                            </p>
                                        </div>
                                        <div style={{ display: 'flex', gap: 6 }}>
